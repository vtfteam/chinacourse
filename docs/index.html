 jídlem pod pokličkou. Najdeš ho ve znacích o jídle: 饭, 饺, 馆."},"氵":{"py":"shuǐ","cz":"voda","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Tři kapky, levá podoba znaku 水 voda. Znaky s 氵 jsou o vodě a tekutinách: 酒, 汤, 洗, 游, 没."},"艹":{"py":"cǎo","cz":"tráva, rostlina","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Dva výhonky trávy vedle sebe, nahoře ve znaku. Znaky s 艹 jsou o rostlinách: 茶, 菜, 英 (původně květ)."},"贝":{"py":"bèi","cz":"škeble, peníze","typ":"zjednodušený","dil":true,"first":6,"trad":"貝","dily":[],"pribeh":"Tradiční 貝 je kresba mušle kauri. Tyhle mušle sloužily ve staré Číně jako peníze, proto je 贝 ve znacích o penězích a obchodu: 贵, 员, a v tradiční podobě i 买 (買) a 卖 (賣)."},"钅":{"py":"jīn","cz":"kov","typ":"zjednodušený","dil":true,"first":6,"trad":"金","dily":[],"pribeh":"Zjednodušená levá podoba znaku 金 jīn (kov, zlato). Znaky s 钅 jsou o kovech a věcech z kovu: 钱, 铁, 银, 钟."},"纟":{"py":"sī","cz":"hedvábí","typ":"zjednodušený","dil":true,"first":6,"trad":"糸","dily":[],"pribeh":"Zjednodušená podoba znaku 糸, kresby smotku hedvábného vlákna. Znaky s 纟 jsou o látkách, nitích a barvách (látky se barvily): 红, 绿."},"辶":{"py":"chuò","cz":"chůze, pohyb","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Původně kresba kroku na cestě. Obtéká znak zleva a zdola a napovídá pohyb nebo vzdálenost: 远, 近, 边, 运, 这, 还."},"土":{"py":"tǔ","cz":"země, hlína","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Kresba hroudy hlíny na zemi. Znaky s 土 jsou o zemi a místech: 地, 在, 块."},"心":{"py":"xīn","cz":"srdce, mysl","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Kresba srdce. Číňané věřili, že srdcem se i myslí, proto 心 najdeš ve znacích o myšlení a citech: 想, 意, 思, 怎. Vlevo má úzkou podobu 忄."},"扌":{"py":"shǒu","cz":"ruka (vlevo ve znaku)","typ":"obrázek","dil":true,"first":2,"trad":null,"dily":[],"pribeh":"Úzká podoba znaku 手 ruka. Znaky s 扌 jsou o činnostech rukou: 打, 扫, 拐, 捷."},"门":{"py":"mén","cz":"dveře, brána","typ":"zjednodušený","dil":true,"first":1,"trad":"門","dily":[],"pribeh":"Tradiční 門 je kresba dvoukřídlých dveří. Jako díl dává často zvuk (们 men, 问 wèn) nebo obklopuje to, co se děje ve dveřích (间)."},"马":{"py":"mǎ","cz":"kůň","typ":"zjednodušený","dil":true,"first":1,"trad":"馬","dily":[],"pribeh":"Tradiční 馬 je kresba koně z boku: hlava s hřívou nahoře, čtyři nohy dole (dnes čtyři tečky). Ve znacích 吗 a 妈 dává jen zvuk ma."},"囗":{"py":"wéi","cz":"ohrada","typ":"obrázek","dil":true,"first":2,"trad":null,"dily":[],"pribeh":"Čtverec, který něco obklopuje: ohrada, hranice. Je větší než 口 ústa a uzavírá celý znak: 国, 因."},"彳":{"py":"chì","cz":"krok","typ":"obrázek","dil":true,"first":1,"trad":null,"dily":[],"pribeh":"Levá polovina znaku 行 (křižovatka). Ve znacích napovídá chůzi a cestu: 往, 得, 很 (tady jen tvarem)."},"目":{"py":"mù","cz":"oko","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Kresba oka postaveného na výšku, aby se vešlo do řádku. Najdeš ho ve 看 (dívat se) a 直 (přímo)."},"又":{"py":"yòu","cz":"ruka; znovu","typ":"obrázek","dil":true,"first":3,"trad":null,"dily":[],"pribeh":"Kresba pravé ruky se třemi prsty. Samostatně dnes znamená „znovu“, ve znacích často stojí za ruku (友, 对) nebo za zjednodušený díl (难, 欢)."},"寸":{"py":"cùn","cz":"ruka, palec","typ":"ukazatel","dil":true,"first":3,"trad":null,"dily":[],"pribeh":"Ruka s tečkou u zápěstí, kde se nahmatá tep. Byla to i délková míra (asi palec). Ve znacích znamená ruku: 对, 付, 得."},"火":{"py":"huǒ","cz":"oheň","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Kresba plamenů. Vlevo ve znaku má podobu 火 (灯), dole čtyři tečky 灬 (点, 黑)."},"灬":{"py":"huǒ","cz":"oheň (dole ve znaku)","typ":"obrázek","dil":true,"first":2,"trad":null,"dily":[],"pribeh":"Čtyři tečky dole ve znaku jsou plameny, podoba znaku 火. Najdeš je v 点 a 黑."},"木":{"py":"mù","cz":"strom, dřevo","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Kresba stromu: kmen, větve nahoře a kořeny dole. Znaky s 木 jsou o stromech a věcech ze dřeva: 杯, 板, 样, 条."},"页":{"py":"yè","cz":"hlava; list","typ":"zjednodušený","dil":true,"first":6,"trad":"頁","dily":[],"pribeh":"Tradiční 頁 je kresba hlavy s vlasy na těle. Ve znacích znamená hlavu a obličej (颜). Samostatně dnes znamená list, stránku."},"刂":{"py":"dāo","cz":"nůž (vpravo ve znaku)","typ":"obrázek","dil":true,"first":2,"trad":null,"dily":[],"pribeh":"Úzká podoba znaku 刀 nůž. Ve znacích znamená řezat a dělit (别, 班) nebo dává zvuk dāo (到)."},"阝":{"py":"fù","cz":"kopec (vlevo); město (vpravo)","typ":"obrázek","dil":true,"first":3,"trad":null,"dily":[],"pribeh":"Vlevo ve znaku je to kopec se stupni (附), vpravo zjednodušené 邑 město (那)."},"攵":{"py":"pū","cz":"ruka s prutem, činnost","typ":"obrázek","dil":true,"first":2,"trad":null,"dily":[],"pribeh":"Ruka, která drží prut nebo hůl. Ve znacích znamená činnost, často i přísnou: 教 (učit)."},"立":{"py":"lì","cz":"stát","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Kresba člověka 大, který stojí na zemi (čára dole). Najdeš ho ve 位 (místo), 站 (stanice) a 旁."},"王":{"py":"wáng","cz":"král; nefrit","typ":"obrázek","dil":true,"first":1,"trad":null,"dily":[],"pribeh":"Samostatně znamená král (a je to častá příjmení, třeba Wang Ming). Jako díl vlevo ale většinou zastupuje 玉 nefrit, vzácný kámen: 现, 班, 球."},"力":{"py":"lì","cz":"síla","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Původně kresba pluhu nebo napjaté paže: síla, práce. Najdeš ho ve 动 (hýbat) a 务 (práce)."},"石":{"py":"shí","cz":"kámen","typ":"obrázek","dil":true,"first":5,"trad":null,"dily":[],"pribeh":"Kámen 口 pod útesem. Ve znacích o kamenech a nádobách: 碗."},"巾":{"py":"jīn","cz":"látka, šátek","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Kresba kusu látky, který visí. Najdeš ho ve 市 a 常."},"夕":{"py":"xī","cz":"večer","typ":"obrázek","dil":true,"first":1,"trad":null,"dily":[],"pribeh":"Měsíc 月 bez jedné čárky: půlměsíc nad obzorem, večer. Najdeš ho ve 名 a 多."},"止":{"py":"zhǐ","cz":"noha, zastavit","typ":"obrázek","dil":true,"first":8,"trad":null,"dily":[],"pribeh":"Kresba chodidla s prsty. Ve znacích znamená nohu a krok: 步, 走 (dole), 足."},"斤":{"py":"jīn","cz":"sekera","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Kresba sekery s topůrkem. Ve znacích znamená sekeru (所) nebo dává zvuk jīn (近, 听)."},"方":{"py":"fāng","cz":"strana, čtverec","typ":"obrázek","dil":true,"first":7,"trad":null,"dily":[],"pribeh":"Původně kresba pluhu nebo člověka s břemenem. Dnes znamená strana, směr, čtverec. Ve znacích dává často zvuk: 旁 páng."},"父":{"py":"fù","cz":"otec","typ":"obrázek","dil":true,"first":3,"trad":null,"dily":[],"pribeh":"Ruka, která drží sekeru nebo hůl: muž, který pracuje a vede rodinu. Najdeš ho nahoře v 爸."},"刀":{"py":"dāo","cz":"nůž","typ":"obrázek","dil":true,"first":4,"trad":null,"dily":[],"pribeh":"Kresba nože s čepelí. Najdeš ho ve 分 (dělit). Vpravo ve znaku má úzkou podobu 刂."},"工":{"py":"gōng","cz":"nástroj, práce","typ":"obrázek","dil":true,"first":4,"trad":null,"dily":[],"pribeh":"Kresba nástroje, asi úhelníku nebo pěchovadla. Ve znacích dává často zvuk: 红 hóng, 空 kōng. V 左 znamená nástroj."},"巴":{"py":"bā","cz":"(zvuk ba)","typ":"obrázek","dil":true,"first":3,"trad":null,"dily":[],"pribeh":"Původně kresba hada. Dnes slouží hlavně jako zvukový díl ba: 爸 bà, 吧 ba."},"你":{"py":"nǐ","cz":"ty","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"尔","role":"zvuk","cz":"ěr, staré slovo pro „ty“"}],"pribeh":"Starší slovo pro „ty“ se psalo 尔. Přidáním 亻 (člověk) vznikl znak, který jasně ukazuje na osobu, se kterou mluvíš."},"我":{"py":"wǒ","cz":"já","typ":"výpůjčka","dil":false,"first":1,"trad":null,"dily":[{"c":"扌","role":"tvar","cz":"vypadá jako ruka"},{"c":"戈","role":"tvar","cz":"sekera na dlouhé násadě"}],"pribeh":"Na nejstarších nápisech je to kresba zubaté sekery na dlouhé násadě. Slovo pro zbraň znělo podobně jako slovo „já“, a tak si ho „já“ vypůjčilo. Pomůcka: ruka drží zbraň a brání sebe."},"他":{"py":"tā","cz":"on","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"也","role":"zvuk","cz":"kdysi se četl podobně"}],"pribeh":"Původně znamenal „jiný, ten druhý“. 亻 ukazuje, že jde o člověka, 也 je tu kvůli zvuku."},"她":{"py":"tā","cz":"ona","typ":"spojení","dil":false,"first":1,"trad":null,"dily":[{"c":"女","role":"význam","cz":"žena"},{"c":"也","role":"tvar","cz":"převzato z 他"}],"pribeh":"Mladý znak: vymyslel ho až kolem roku 1920 lingvista Liu Bannong, aby psaná čínština odlišila „ona“ od „on“. Vzal znak 他 a vyměnil 亻 člověk za 女 žena. Vyslovují se oba stejně, tā."},"们":{"py":"men","cz":"přípona množného čísla","typ":"zvuk","dil":false,"first":1,"trad":"們","dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"门","role":"zvuk","cz":"mén"}],"pribeh":"Člověk 亻 ukazuje, že jde o lidi, a 门 mén dává zvuk. Proto se 们 přidává hlavně k osobám: 我们, 你们, 他们."},"好":{"py":"hǎo","cz":"dobrý","typ":"spojení","dil":false,"first":1,"trad":null,"dily":[{"c":"女","role":"význam","cz":"žena"},{"c":"子","role":"význam","cz":"dítě"}],"pribeh":"Na nejstarších nápisech žena 女 drží v náruči dítě 子. Matka s dítětem byla obrazem toho, co je dobré a krásné."},"叫":{"py":"jiào","cz":"jmenovat se, volat","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"丩","role":"zvuk","cz":"jiū"}],"pribeh":"Ústa 口 = volat, křičet. 丩 (jiū) napovídá výslovnost. Volat na někoho jménem znamená taky „jmenovat se“: 我叫…"},"什":{"py":"shén","cz":"co (v 什么)","typ":"spojení","dil":false,"first":1,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"十","role":"zvuk","cz":"shí, deset"}],"pribeh":"Původně skupina deseti 十 lidí 亻, desítka (čte se shí). Ve slově 什么 z něj zbyla jen slabika shén."},"么":{"py":"me","cz":"(slabika v 什么, 怎么)","typ":"zjednodušený","dil":false,"first":1,"trad":"麼","dily":[{"c":"丿","role":"tvar","cz":"šikmý tah"},{"c":"厶","role":"tvar","cz":"malý tvar"}],"pribeh":"Zjednodušená podoba znaku 麼, který kdysi znamenal „drobný“. Dnes slouží jen jako slabika ve slovech 什么, 怎么 a 这么."},"名":{"py":"míng","cz":"jméno","typ":"spojení","dil":false,"first":1,"trad":null,"dily":[{"c":"夕","role":"význam","cz":"večer"},{"c":"口","role":"význam","cz":"ústa"}],"pribeh":"Večer 夕 a ústa 口. Starý výklad: večer ve tmě nevidíš, kdo jde, a tak člověk musí nahlas říct své jméno."},"字":{"py":"zì","cz":"znak, písmeno","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"宀","role":"význam","cz":"střecha"},{"c":"子","role":"zvuk","cz":"zǐ, dítě"}],"pribeh":"Dítě 子 pod střechou 宀: původně „rodit a vychovávat děti“. 子 zǐ zároveň napovídá výslovnost. Později slovo přešlo na písmo: znaky se z sebe „rodí“ jako rodina."},"很":{"py":"hěn","cz":"velmi","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"彳","role":"význam","cz":"krok"},{"c":"艮","role":"zvuk","cz":"gèn"}],"pribeh":"Původně znamenal „neposlušný, tvrdohlavý“ a 艮 gèn v něm dává zvuk. Pro dnešní „velmi“ si ho vypůjčili."},"高":{"py":"gāo","cz":"vysoký","typ":"obrázek","dil":false,"first":1,"trad":null,"dily":[],"pribeh":"Kresba vysoké stavby nebo věže: nahoře střecha, uprostřed patro s oknem 口, dole vchod."},"兴":{"py":"xìng","cz":"radost; rozkvět","typ":"zjednodušený","dil":false,"first":1,"trad":"興","dily":[],"pribeh":"Tradiční 興 jsou čtyři ruce, které společně zvedají nějaký předmět: zvednout, povznést, rozkvétat. Odtud 高兴 (radostný). Zjednodušený tvar ponechal jen obrys."},"认":{"py":"rèn","cz":"poznat","typ":"zvuk","dil":false,"first":1,"trad":"認","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"人","role":"zvuk","cz":"rén"}],"pribeh":"Řeč 讠 a člověk 人, který dává i zvuk rén: poznat člověka podle řeči. Pomůcka: poznáš, kdo mluví."},"识":{"py":"shí","cz":"znát","typ":"zvuk","dil":false,"first":1,"trad":"識","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"只","role":"zvuk","cz":"zhǐ"}],"pribeh":"Řeč 讠 a 只 zhǐ, který dává zvuk. Spolu s 认 tvoří 认识: znát (člověka)."},"也":{"py":"yě","cz":"také","typ":"výpůjčka","dil":false,"first":1,"trad":null,"dily":[],"pribeh":"Původ je nejistý a původní význam se ztratil. Dnes je to hlavně gramatické slovo „také“ a častý zvukový díl: 他, 她, 地."},"吗":{"py":"ma","cz":"(otázka ano/ne)","typ":"zvuk","dil":false,"first":1,"trad":"嗎","dily":[{"c":"口","role":"význam","cz":"ústa, částice"},{"c":"马","role":"zvuk","cz":"mǎ"}],"pribeh":"Ústa 口 říkají, že jde o slovo, které jen „zní“. 马 mǎ (kůň) dává zvuk ma."},"呢":{"py":"ne","cz":"(a co…?)","typ":"zvuk","dil":false,"first":1,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa, částice"},{"c":"尼","role":"zvuk","cz":"ní"}],"pribeh":"Další částice s ústy 口. Vpravo 尼 ní dává zvuk."},"谢":{"py":"xiè","cz":"děkovat","typ":"zvuk","dil":false,"first":1,"trad":"謝","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"射","role":"zvuk","cz":"shè, střílet"}],"pribeh":"Řeč 讠 říká, že jde o slova, 射 shè dává zvuk. Pomůcka: díky „vystřelíš“ slovy."},"再":{"py":"zài","cz":"znovu","typ":"spojení","dil":false,"first":1,"trad":null,"dily":[{"c":"一","role":"význam","cz":"jedna, ještě jednou"},{"c":"冉","role":"tvar","cz":"zbytek starší kresby"}],"pribeh":"Nahoře 一 jedna: „ještě jeden, podruhé“. Spodní část je zbytek staré kresby dvou do sebe zapadajících dílů. Pomůcka: přidej ještě jednu čáru a máš to znovu."},"见":{"py":"jiàn","cz":"vidět","typ":"obrázek","dil":false,"first":1,"trad":"見","dily":[{"c":"目","role":"význam","cz":"oko (v tradiční podobě)"},{"c":"儿","role":"význam","cz":"nohy, člověk"}],"pribeh":"V tradiční podobě 見 je velké oko 目 na nohách 儿: člověk, který se dívá. Zjednodušený tvar oko zkrátil."},"是":{"py":"shì","cz":"být","typ":"spojení","dil":false,"first":2,"trad":null,"dily":[{"c":"日","role":"význam","cz":"slunce"},{"c":"疋","role":"tvar","cz":"zbytek znaku 正 (rovný)"}],"pribeh":"Nahoře slunce 日, dole tvar odvozený ze znaku 正 (rovný, správný). Původně „přímý, správný“, odtud „ano, je to tak“ a nakonec dnešní „být“."},"不":{"py":"bù","cz":"ne","typ":"výpůjčka","dil":false,"first":2,"trad":null,"dily":[],"pribeh":"Původně asi kresba kořínků nebo kalichu květu. Znak si vypůjčili pro zápor, protože zněl podobně, a původní význam zmizel."},"哪":{"py":"nǎ","cz":"který","typ":"zvuk","dil":false,"first":2,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa, otázka"},{"c":"那","role":"zvuk","cz":"nà, tamten"}],"pribeh":"Ústa 口 z něj dělají tázací slovo, 那 nà (tamten) dává zvuk: „který z nich?“"},"国":{"py":"guó","cz":"země, stát","typ":"spojení","dil":false,"first":2,"trad":"國","dily":[{"c":"囗","role":"význam","cz":"ohrada, hranice"},{"c":"玉","role":"význam","cz":"nefrit, poklad"}],"pribeh":"Zjednodušená podoba vložila do ohrady 囗 nefrit 玉: poklad uvnitř hranic. Tradiční 國 má uvnitř 或, kdysi „území, které se brání zbraní“."},"人":{"py":"rén","cz":"člověk","typ":"obrázek","dil":false,"first":2,"trad":null,"dily":[],"pribeh":"Kresba člověka z boku: trup a dvě nohy v kroku. Vlevo ve znaku má úzkou podobu 亻."},"捷":{"py":"jié","cz":"rychlý (v 捷克 jen zvuk)","typ":"zvuk","dil":false,"first":2,"trad":null,"dily":[{"c":"扌","role":"význam","cz":"ruka"},{"c":"疌","role":"zvuk","cz":"jié"}],"pribeh":"Ruka 扌 a zvukový díl 疌: rychlý, obratný. V 捷克 slouží jen jako přepis zvuku: Čech → Jié-kè."},"克":{"py":"kè","cz":"zvládnout (v 捷克 jen zvuk)","typ":"obrázek","dil":false,"first":2,"trad":null,"dily":[],"pribeh":"Původně kresba člověka s těžkou přilbou nebo nákladem na hlavě: unést, zvládnout. V 捷克 je jen kvůli zvuku."},"中":{"py":"zhōng","cz":"střed","typ":"ukazatel","dil":false,"first":2,"trad":null,"dily":[{"c":"口","role":"tvar","cz":"čtverec"},{"c":"丨","role":"význam","cz":"čára středem"}],"pribeh":"Čára prochází přesně středem čtverce: střed. Na nejstarších nápisech to byl prapor uprostřed tábora. 中国 je „Prostřední země“."},"学":{"py":"xué","cz":"učit se","typ":"zjednodušený","dil":false,"first":2,"trad":"學","dily":[{"c":"冖","role":"význam","cz":"střecha, přikrývka"},{"c":"子","role":"význam","cz":"dítě"}],"pribeh":"V tradiční podobě 學 dvě ruce předávají znalosti (křížky 爻) dítěti 子 pod střechou. Zjednodušený tvar nahradil horní část třemi čárkami. Pomůcka: dítě pod střechou školy."},"生":{"py":"shēng","cz":"růst, žít; žák","typ":"obrázek","dil":false,"first":2,"trad":null,"dily":[{"c":"屮","role":"význam","cz":"výhonek"},{"c":"土","role":"význam","cz":"země"}],"pribeh":"Rostlinka vyráží ze země 土: růst, narodit se, žít. V 学生 znamená „žák“."},"老":{"py":"lǎo","cz":"starý","typ":"obrázek","dil":false,"first":2,"trad":null,"dily":[{"c":"耂","role":"význam","cz":"stařec s dlouhými vlasy"},{"c":"匕","role":"tvar","cz":"ohnutá postava, hůl"}],"pribeh":"Kresba shrbeného starce s dlouhými vlasy, který se opírá o hůl. 老 vyjadřuje i úctu: 老师 je „ctihodný mistr“."},"师":{"py":"shī","cz":"mistr, učitel","typ":"zjednodušený","dil":false,"first":2,"trad":"師","dily":[{"c":"刂","role":"tvar","cz":"zkrácená levá část"},{"c":"帀","role":"tvar","cz":"obklopit"}],"pribeh":"Tradiční 師 znamenal vojenský oddíl a jeho velitele. Odtud „vůdce, mistr“ a 老师 učitel. Zjednodušení zkrátilo levou část na dvě čárky."},"教":{"py":"jiāo","cz":"učit (někoho)","typ":"spojení","dil":false,"first":2,"trad":null,"dily":[{"c":"孝","role":"tvar","cz":"dítě 子 a znalosti nahoře"},{"c":"攵","role":"význam","cz":"ruka s prutem"}],"pribeh":"Vpravo ruka s prutem 攵, vlevo dítě 子, nad kterým jsou kdysi kreslené znalosti. Učitel vede dítě, a za starých časů i prutem."},"会":{"py":"huì","cz":"umět; setkat se","typ":"zjednodušený","dil":false,"first":2,"trad":"會","dily":[{"c":"人","role":"tvar","cz":"poklička"},{"c":"云","role":"tvar","cz":"spodní část"}],"pribeh":"Tradiční 會 je hrnec s pokličkou: věci se spojí dohromady, setkají se. Význam „umět“ (naučit se, spojit si to) přišel později."},"说":{"py":"shuō","cz":"mluvit, říct","typ":"zvuk","dil":false,"first":2,"trad":"說","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"兑","role":"zvuk","cz":"duì"}],"pribeh":"Řeč 讠 a 兑 duì, který dává zvuk. Pomůcka: 兑 vypadá jako člověk s otevřenou pusou."},"文":{"py":"wén","cz":"písmo, kultura","typ":"obrázek","dil":false,"first":2,"trad":null,"dily":[],"pribeh":"Kresba člověka s ozdobným tetováním na hrudi: vzor, ozdoba, později písmo a kultura. 中文 je čínské písmo a jazyk."},"英":{"py":"yīng","cz":"květ; Anglie","typ":"zvuk","dil":false,"first":2,"trad":null,"dily":[{"c":"艹","role":"význam","cz":"rostlina"},{"c":"央","role":"zvuk","cz":"yāng"}],"pribeh":"Původně „květ“ (rostlina 艹, zvuk 央). V 英国 a 英语 zachycuje zvuk slova England."},"语":{"py":"yǔ","cz":"jazyk, řeč","typ":"zvuk","dil":false,"first":2,"trad":"語","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"吾","role":"zvuk","cz":"wú"}],"pribeh":"Řeč 讠 a 吾 wú (staré „já“), který dává zvuk. Země + 语 = jazyk té země: 英语, 捷克语."},"一":{"py":"yī","cz":"jedna","typ":"ukazatel","dil":false,"first":2,"trad":null,"dily":[],"pribeh":"Jedna vodorovná čára. Stejně jednoduše vznikly 二 a 三."},"点":{"py":"diǎn","cz":"tečka; hodina","typ":"zvuk","dil":false,"first":2,"trad":"點","dily":[{"c":"占","role":"zvuk","cz":"zhàn"},{"c":"灬","role":"význam","cz":"oheň (z 黑 černý)"}],"pribeh":"Tradiční 點 = 黑 černý + 占 (zvuk): černá tečka. Zjednodušený tvar ponechal z 黑 jen ohnivé tečky 灬. Z „tečky“ se stala hodina na ciferníku."},"儿":{"py":"ér","cz":"dítě; koncové -r","typ":"zjednodušený","dil":false,"first":2,"trad":"兒","dily":[],"pribeh":"Tradiční 兒 je kresba dítěte s velkou hlavou a ještě nesrostlou lebkou. Zjednodušený tvar ponechal jen nohy. Na konci slov dělá pekingské -r: 一点儿."},"可":{"py":"kě","cz":"smět, moci; ale","typ":"spojení","dil":false,"first":2,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"丁","role":"tvar","cz":"háček"}],"pribeh":"Ústa 口 a háček: původně „souhlasit, schválit“ (říct ano). Odtud „smět, moci“ a v 可是 „ale“."},"难":{"py":"nán","cz":"těžký","typ":"zjednodušený","dil":false,"first":2,"trad":"難","dily":[{"c":"又","role":"tvar","cz":"zjednodušená levá část"},{"c":"隹","role":"význam","cz":"pták"}],"pribeh":"Tradiční 難 byl název ptáka 隹. Slovo „těžký“ znělo stejně, a tak si znak vypůjčilo. Zjednodušení nahradilo složitou levou část rukou 又."},"这":{"py":"zhè","cz":"tento","typ":"zjednodušený","dil":false,"first":3,"trad":"這","dily":[{"c":"辶","role":"význam","cz":"pohyb"},{"c":"文","role":"tvar","cz":"místo složitějšího 言"}],"pribeh":"Tradiční 這 = 辶 pohyb + 言 řeč. Zjednodušený tvar nahradil 言 jednodušším 文. Ukazuje na něco blízko: tohle."},"那":{"py":"nà","cz":"tamten","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[{"c":"冄","role":"tvar","cz":"levá část"},{"c":"阝","role":"význam","cz":"město (vpravo)"}],"pribeh":"Vpravo 阝 (město): původně jméno místa. Pro „tamten“ si ho vypůjčili kvůli zvuku. Je i zvukovým dílem v 哪 nǎ."},"的":{"py":"de","cz":"(přivlastnění)","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"白","role":"význam","cz":"bílý, jasný"},{"c":"勺","role":"zvuk","cz":"sháo"}],"pribeh":"Původně „jasný; střed terče“ (dnes 目的 cíl). 白 bílý = jasný, 勺 dává zvuk. Jako přivlastňovací částice se používá kvůli zvuku."},"家":{"py":"jiā","cz":"domov, rodina","typ":"spojení","dil":false,"first":3,"trad":null,"dily":[{"c":"宀","role":"význam","cz":"střecha"},{"c":"豕","role":"význam","cz":"prase"}],"pribeh":"Prase 豕 pod střechou 宀. Ve staré Číně se prasata chovala přímo u obydlí (často v přízemí domu), takže prase pod střechou znamenalo domov."},"对":{"py":"duì","cz":"správně; proti","typ":"zjednodušený","dil":false,"first":3,"trad":"對","dily":[{"c":"又","role":"význam","cz":"ruka"},{"c":"寸","role":"význam","cz":"ruka"}],"pribeh":"Tradiční 對 je ruka 寸, která drží nástroj. Zjednodušený tvar má dvě ruce 又 a 寸 proti sobě. Pomůcka: dvě ruce si plácnou, „správně, souhlasí“."},"爸":{"py":"bà","cz":"táta","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"父","role":"význam","cz":"otec"},{"c":"巴","role":"zvuk","cz":"bā"}],"pribeh":"Nahoře 父 otec, dole 巴 bā, který dává zvuk. Stejně funguje 妈: význam + zvuk."},"妈":{"py":"mā","cz":"máma","typ":"zvuk","dil":false,"first":3,"trad":"媽","dily":[{"c":"女","role":"význam","cz":"žena"},{"c":"马","role":"zvuk","cz":"mǎ"}],"pribeh":"Vlevo 女 říká, že jde o ženu, vpravo 马 mǎ (kůň) dává jen zvuk. Typický znak „význam + zvuk“."},"哥":{"py":"gē","cz":"starší bratr","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[{"c":"可","role":"zvuk","cz":"kě"},{"c":"可","role":"zvuk","cz":"kě"}],"pribeh":"Dvakrát 可 nad sebou, který dává zvuk. Původně znamenal „zpívat“ (dnes se píše 歌), pro staršího bratra si ho vypůjčili."},"姐":{"py":"jiě","cz":"starší sestra","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"女","role":"význam","cz":"žena"},{"c":"且","role":"zvuk","cz":"qiě"}],"pribeh":"Žena 女 a 且 qiě, který dává zvuk."},"弟":{"py":"dì","cz":"mladší bratr","typ":"obrázek","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Kresba provazu, který je kolem kolíku omotaný závit za závitem: pořadí, posloupnost. Odtud „ten, kdo přišel po mně“, mladší bratr."},"妹":{"py":"mèi","cz":"mladší sestra","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"女","role":"význam","cz":"žena"},{"c":"未","role":"zvuk","cz":"wèi"}],"pribeh":"Žena 女 a 未 wèi (ještě ne), který dává zvuk. Pomůcka: ta, která ještě není dospělá."},"孩":{"py":"hái","cz":"dítě","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"子","role":"význam","cz":"dítě"},{"c":"亥","role":"zvuk","cz":"hài"}],"pribeh":"Dítě 子 a 亥 hài, který dává zvuk. Spolu s 子 tvoří 孩子."},"子":{"py":"zǐ","cz":"dítě; (přípona)","typ":"obrázek","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Kresba miminka v zavinovačce: velká hlava, rozpažené ručičky a nohy zabalené. Ve slovech jako 孩子 nebo 饺子 se čte lehce zi."},"有":{"py":"yǒu","cz":"mít; je","typ":"spojení","dil":false,"first":3,"trad":null,"dily":[{"c":"又","role":"význam","cz":"ruka (tady zkrácená na dva tahy)"},{"c":"月","role":"význam","cz":"maso (ne měsíc)"}],"pribeh":"Ruka nahoře drží kus masa 月. Ve znacích 月 často nezastupuje měsíc, ale maso. Mít v ruce maso znamenalo „mít“."},"没":{"py":"méi","cz":"ne (zápor 有)","typ":"spojení","dil":false,"first":3,"trad":null,"dily":[{"c":"氵","role":"význam","cz":"voda"},{"c":"殳","role":"tvar","cz":"ruka (zjednodušený tvar)"}],"pribeh":"Voda 氵 a ruka, která se noří: „potopit se, zmizet pod vodou“. Odtud „není, nemít“."},"个":{"py":"gè","cz":"(měrné slovo)","typ":"zjednodušený","dil":false,"first":3,"trad":"個","dily":[{"c":"人","role":"tvar","cz":"střecha"},{"c":"丨","role":"tvar","cz":"svislá čára"}],"pribeh":"Tradiční 個 = 亻 člověk + 固 gù (zvuk). Zjednodušený tvar připomíná jednu tyčku pod stříškou: jeden kus."},"几":{"py":"jǐ","cz":"kolik","typ":"zjednodušený","dil":false,"first":3,"trad":"幾","dily":[],"pribeh":"Samo 几 je kresba nízkého stolku. Znak 幾 (málo, kolik) se četl stejně, a tak ho zjednodušení nahradilo tímhle tvarem."},"岁":{"py":"suì","cz":"rok věku","typ":"zjednodušený","dil":false,"first":3,"trad":"歲","dily":[{"c":"山","role":"tvar","cz":"hora"},{"c":"夕","role":"tvar","cz":"večer"}],"pribeh":"Tradiční 歲 je sekera a kroky: sklizeň, která se opakuje každý rok. Pomůcka pro zjednodušený tvar: kolik večerů 夕 za horou 山 už uběhlo."},"和":{"py":"hé","cz":"a; harmonie","typ":"zvuk","dil":false,"first":3,"trad":null,"dily":[{"c":"禾","role":"zvuk","cz":"hé, obilí"},{"c":"口","role":"význam","cz":"ústa"}],"pribeh":"Ústa 口 a obilí 禾, které dává zvuk. Původně „odpovídat si zpěvem, ladit spolu“, odtud harmonie a spojka „a“."},"两":{"py":"liǎng","cz":"dva (kusy)","typ":"obrázek","dil":false,"first":3,"trad":"兩","dily":[],"pribeh":"Kresba dvojitého jha pro dva koně nebo dvou závaží na vahách: pár, dva."},"二":{"py":"èr","cz":"dva","typ":"ukazatel","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Dvě vodorovné čáry. Při počítání věcí se ale říká 两."},"三":{"py":"sān","cz":"tři","typ":"ukazatel","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Tři vodorovné čáry."},"四":{"py":"sì","cz":"čtyři","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně se čtyřka psala čtyřmi čárami. Dnešní tvar je jiný znak (snad kresba úst s dechem), který si číslo vypůjčilo kvůli zvuku."},"五":{"py":"wǔ","cz":"pět","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně kříž mezi dvěma čarami: křížení. Pro pětku si ho vypůjčili."},"六":{"py":"liù","cz":"šest","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně asi kresba chatrče se střechou. Pro šestku si ho vypůjčili."},"七":{"py":"qī","cz":"sedm","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně svislá čára přeťatá vodorovnou: „přeříznout“ (dnes 切). Pro sedmičku si ho vypůjčili."},"八":{"py":"bā","cz":"osm","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Dvě čáry, které se od sebe rozcházejí: rozdělit. Pro osmičku si ho vypůjčili, ale význam „dělit“ zůstal v dílech: 分, 半."},"九":{"py":"jiǔ","cz":"devět","typ":"výpůjčka","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně snad ohnutá paže nebo loket. Pro devítku si ho vypůjčili."},"十":{"py":"shí","cz":"deset","typ":"ukazatel","dil":false,"first":3,"trad":null,"dily":[],"pribeh":"Původně svislá čára (svazek) se ztluštěním uprostřed, později kříž. Vyšší čísla se z něj skládají: 二十 = 2 × 10."},"现":{"py":"xiàn","cz":"teď; objevit se","typ":"zvuk","dil":false,"first":4,"trad":"現","dily":[{"c":"王","role":"význam","cz":"nefrit"},{"c":"见","role":"zvuk","cz":"jiàn, vidět"}],"pribeh":"Nefrit 王 a 见 vidět, který dává i zvuk: lesk nefritu se ukáže, „objevit se“. Co se ukazuje právě teď, je přítomnost: 现在."},"在":{"py":"zài","cz":"být (někde); v","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"才","role":"zvuk","cz":"cái"},{"c":"土","role":"význam","cz":"země"}],"pribeh":"Země 土 ukazuje místo, 才 cái dává zvuk: „být na místě, nacházet se“."},"分":{"py":"fēn","cz":"dělit; minuta","typ":"spojení","dil":false,"first":4,"trad":null,"dily":[{"c":"八","role":"význam","cz":"rozdělit"},{"c":"刀","role":"význam","cz":"nůž"}],"pribeh":"Nůž 刀 a nad ním 八 (dvě čáry od sebe): rozkrojit, rozdělit. Hodina rozdělená na díly dává minuty."},"半":{"py":"bàn","cz":"půl","typ":"spojení","dil":false,"first":4,"trad":null,"dily":[{"c":"八","role":"význam","cz":"rozdělit"},{"c":"牛","role":"význam","cz":"kráva"}],"pribeh":"Kráva 牛 a nad ní 八 (rozdělit): rozpůlit krávu, polovina."},"今":{"py":"jīn","cz":"teď, dnes","typ":"výpůjčka","dil":false,"first":4,"trad":null,"dily":[],"pribeh":"Původně snad kresba poklice nebo zvonu. Slovo „teď“ znělo podobně, a tak si znak vypůjčilo. Vyskytuje se ve 今天 dnes."},"天":{"py":"tiān","cz":"nebe; den","typ":"obrázek","dil":false,"first":4,"trad":null,"dily":[{"c":"一","role":"význam","cz":"to, co je nad hlavou"},{"c":"大","role":"význam","cz":"člověk s rozpaženýma rukama"}],"pribeh":"Člověk 大 s velkou zdůrazněnou hlavou, později čára nad hlavou: to, co je nad člověkem, nebe. Odtud i „den“."},"明":{"py":"míng","cz":"jasný","typ":"spojení","dil":false,"first":4,"trad":null,"dily":[{"c":"日","role":"význam","cz":"slunce"},{"c":"月","role":"význam","cz":"měsíc"}],"pribeh":"Slunce 日 a měsíc 月 vedle sebe: dvě největší světla, jasný. 明天 je „jasný den“, zítřek."},"昨":{"py":"zuó","cz":"včera","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"日","role":"význam","cz":"den"},{"c":"乍","role":"zvuk","cz":"zhà"}],"pribeh":"Den 日 a 乍 zhà, který dává zvuk: včerejší den."},"星":{"py":"xīng","cz":"hvězda","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"日","role":"význam","cz":"světlo"},{"c":"生","role":"zvuk","cz":"shēng"}],"pribeh":"Nahoře původně tři malá světla (hvězdy), dnes jen 日. Dole 生 shēng dává zvuk."},"期":{"py":"qī","cz":"období, lhůta","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"其","role":"zvuk","cz":"qí"},{"c":"月","role":"význam","cz":"měsíc"}],"pribeh":"Měsíc 月 jako měřítko času a 其 qí, který dává zvuk: období. 星期 je týden, „hvězdné období“ podle sedmi nebeských těles."},"月":{"py":"yuè","cz":"měsíc","typ":"obrázek","dil":false,"first":4,"trad":null,"dily":[],"pribeh":"Kresba srpku měsíce. Pozor: jako díl ve znacích často zastupuje maso, které má stejný tvar (有, 服, 朋)."},"号":{"py":"hào","cz":"číslo; den v měsíci","typ":"zjednodušený","dil":false,"first":4,"trad":"號","dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"丂","role":"tvar","cz":"výdech"}],"pribeh":"Ústa 口 a výdech: volat, vyvolávat. Tradiční 號 k tomu přidal tygra 虎, který řve. Z vyvolávání čísel je dnes „číslo“ a den v měsíci."},"早":{"py":"zǎo","cz":"brzy, ráno","typ":"spojení","dil":false,"first":4,"trad":null,"dily":[{"c":"日","role":"význam","cz":"slunce"},{"c":"十","role":"tvar","cz":"obzor"}],"pribeh":"Slunce 日 těsně nad čárou: slunce vychází nad obzor, ráno. Pomůcka: 十 je jako stéblo, nad kterým se slunce právě vyhouplo."},"上":{"py":"shàng","cz":"nahoře; jít nahoru","typ":"ukazatel","dil":false,"first":4,"trad":null,"dily":[],"pribeh":"Krátká čárka nad dlouhou vodorovnou: nahoře. Odtud i 上午 (dopoledne, „horní“ část dne) a 上课 (jít na výuku)."},"午":{"py":"wǔ","cz":"poledne","typ":"výpůjčka","dil":false,"first":4,"trad":null,"dily":[],"pribeh":"Původně kresba paličky na drcení obilí. Pro poledne si ho vypůjčili: 午 je sedmá z dvanácti dvouhodin starého čínského dne (11–13 h)."},"下":{"py":"xià","cz":"dole; další","typ":"ukazatel","dil":false,"first":4,"trad":null,"dily":[],"pribeh":"Čárka pod vodorovnou čarou: dole. Odtud 下午 (odpoledne, „spodní“ část dne) a 下个 (příští)."},"晚":{"py":"wǎn","cz":"večer; pozdě","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"日","role":"význam","cz":"slunce"},{"c":"免","role":"zvuk","cz":"miǎn"}],"pribeh":"Slunce 日 a 免 miǎn (vyhnout se), který dává zvuk. Pomůcka: slunce už se vytrácí."},"空":{"py":"kòng","cz":"volno; prázdný","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"穴","role":"význam","cz":"jeskyně, díra"},{"c":"工","role":"zvuk","cz":"gōng"}],"pribeh":"Jeskyně 穴 a 工 gōng, který dává zvuk: dutina, prázdno. 有空 = mít prázdno, mít čas."},"课":{"py":"kè","cz":"lekce","typ":"zvuk","dil":false,"first":4,"trad":"課","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"果","role":"zvuk","cz":"guǒ"}],"pribeh":"Řeč 讠 a 果 guǒ (ovoce), který dává zvuk: výuka, lekce."},"班":{"py":"bān","cz":"třída; směna","typ":"spojení","dil":false,"first":4,"trad":null,"dily":[{"c":"王","role":"význam","cz":"nefrit"},{"c":"刂","role":"význam","cz":"nůž"},{"c":"王","role":"význam","cz":"nefrit"}],"pribeh":"Nůž 刂 mezi dvěma kusy nefritu: rozdělit nefrit na části. Odtud skupina, třída a pracovní směna: 上班 jít do práce."},"起":{"py":"qǐ","cz":"vstát, začít","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"走","role":"význam","cz":"jít"},{"c":"己","role":"zvuk","cz":"jǐ"}],"pribeh":"Jít 走 a 己 jǐ, který dává zvuk: zvednout se, vstát. 一起 je „v jednom pohybu“, spolu."},"喝":{"py":"hē","cz":"pít","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"曷","role":"zvuk","cz":"hé"}],"pribeh":"Ústa 口 a 曷 hé, který dává zvuk."},"咖":{"py":"kā","cz":"(slabika ka)","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"口","role":"význam","cz":"zvukový přepis"},{"c":"加","role":"zvuk","cz":"jiā"}],"pribeh":"Ústa 口 tu oznamují, že znak jen zachycuje zvuk cizího slova. 加 jiā napoví výslovnost. Spolu s 啡 tvoří 咖啡 kāfēi, káva."},"啡":{"py":"fēi","cz":"(slabika fej)","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"口","role":"význam","cz":"zvukový přepis"},{"c":"非","role":"zvuk","cz":"fēi"}],"pribeh":"Ústa 口 a 非 fēi, který dává přesně ten zvuk. Druhá polovina slova 咖啡."},"吧":{"py":"ba","cz":"(návrh: pojďme)","typ":"zvuk","dil":false,"first":4,"trad":null,"dily":[{"c":"口","role":"význam","cz":"částice"},{"c":"巴","role":"zvuk","cz":"bā"}],"pribeh":"Ústa 口 pro částici, která jen „zní“, a 巴 bā pro zvuk."},"饭":{"py":"fàn","cz":"jídlo; vařená rýže","typ":"zvuk","dil":false,"first":5,"trad":"飯","dily":[{"c":"饣","role":"význam","cz":"jídlo"},{"c":"反","role":"zvuk","cz":"fǎn"}],"pribeh":"Jídlo 饣 a 反 fǎn, který dává zvuk. 饭 je vařená rýže i jídlo vůbec: 吃饭 = jíst."},"馆":{"py":"guǎn","cz":"budova, podnik","typ":"zvuk","dil":false,"first":5,"trad":"館","dily":[{"c":"饣","role":"význam","cz":"jídlo"},{"c":"官","role":"zvuk","cz":"guān, úřad"}],"pribeh":"Jídlo 饣 a 官 guān (úřad, veřejná budova), který dává i zvuk: dům, kde se hosté najedí. Dnes i jiné veřejné budovy."},"服":{"py":"fú","cz":"oblečení; sloužit","typ":"spojení","dil":false,"first":5,"trad":null,"dily":[{"c":"月","role":"tvar","cz":"původně loď"},{"c":"卩","role":"význam","cz":"klečící člověk"},{"c":"又","role":"význam","cz":"ruka"}],"pribeh":"Vpravo ruka, která tlačí klečícího člověka: podrobit se, sloužit. Vlevo byla původně loď (dnes vypadá jako 月). Odtud „sloužit“ (服务) a to, co nosíš (衣服)."},"务":{"py":"wù","cz":"práce, záležitost","typ":"zjednodušený","dil":false,"first":5,"trad":"務","dily":[{"c":"夂","role":"tvar","cz":"zbytek tradiční podoby"},{"c":"力","role":"význam","cz":"síla"}],"pribeh":"Tradiční 務 = kopí + ruka v činnosti + 力 síla: usilovně pracovat. Zjednodušený tvar ponechal hlavně sílu 力. 服务 je služba."},"员":{"py":"yuán","cz":"pracovník, člen","typ":"zjednodušený","dil":false,"first":5,"trad":"員","dily":[{"c":"口","role":"význam","cz":"kruhový otvor"},{"c":"贝","role":"tvar","cz":"původně nádoba"}],"pribeh":"Původně kruhový otvor 口 nad nádobou: „kulatý“. Později počet lidí, člen: 服务员 je „člověk služby“, obsluha."},"菜":{"py":"cài","cz":"zelenina; jídlo","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"艹","role":"význam","cz":"rostlina"},{"c":"采","role":"zvuk","cz":"cǎi, trhat"}],"pribeh":"Rostlina 艹 a 采 cǎi (ruka trhá z keře), který dává i zvuk: natrhaná zelenina. Dnes i chod na stole a jídlo vůbec: 菜单."},"单":{"py":"dān","cz":"jednotlivý; seznam","typ":"zjednodušený","dil":false,"first":5,"trad":"單","dily":[],"pribeh":"Původně kresba vidlice nebo lovecké zbraně. Dnes „jediný“ a „list, seznam“: 菜单 jídelní lístek, 买单 účet."},"想":{"py":"xiǎng","cz":"myslet; chtít","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"相","role":"zvuk","cz":"xiāng"},{"c":"心","role":"význam","cz":"srdce, mysl"}],"pribeh":"Srdce 心 = myšlení, 相 xiāng dává zvuk. Pomůcka: 相 je oko 目 za stromem 木, díváš se a v srdci přemýšlíš."},"要":{"py":"yào","cz":"chtít; dát si","typ":"výpůjčka","dil":false,"first":5,"trad":null,"dily":[{"c":"覀","role":"tvar","cz":"ruce v bok"},{"c":"女","role":"tvar","cz":"žena"}],"pribeh":"Původně kresba ženy 女 s rukama v bok: „pas“ (dnes se píše 腰). Slovo „chtít“ znělo stejně a znak si vypůjčilo."},"吃":{"py":"chī","cz":"jíst","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"乞","role":"zvuk","cz":"qǐ"}],"pribeh":"Ústa 口 a 乞 qǐ, který dává zvuk."},"米":{"py":"mǐ","cz":"rýže (zrní)","typ":"obrázek","dil":false,"first":5,"trad":null,"dily":[],"pribeh":"Zrnka rýže rozsypaná kolem stébla. 米饭 je vařená rýže."},"面":{"py":"miàn","cz":"obličej; nudle","typ":"obrázek","dil":false,"first":5,"trad":"麵","dily":[],"pribeh":"Kresba obličeje s okem uprostřed. „Nudle“ se tradičně psaly 麵 (s 麥 pšenice). Zjednodušený zápis je sloučil s 面 obličej."},"条":{"py":"tiáo","cz":"proužek, pruh","typ":"zjednodušený","dil":false,"first":5,"trad":"條","dily":[{"c":"夂","role":"tvar","cz":"zbytek"},{"c":"木","role":"význam","cz":"strom"}],"pribeh":"Tradiční 條 = strom 木 a zvukový díl: dlouhá tenká větev. Odtud něco dlouhého a tenkého: 面条 nudle."},"牛":{"py":"niú","cz":"kráva, býk","typ":"obrázek","dil":false,"first":5,"trad":null,"dily":[],"pribeh":"Kresba hlavy krávy s rohy, viděné zepředu. 牛肉 je hovězí."},"肉":{"py":"ròu","cz":"maso","typ":"obrázek","dil":false,"first":5,"trad":null,"dily":[],"pribeh":"Kresba kusu masa s žilkami. Ve znacích se mění na tvar ⺼, který vypadá jako 月."},"饺":{"py":"jiǎo","cz":"knedlíček","typ":"zvuk","dil":false,"first":5,"trad":"餃","dily":[{"c":"饣","role":"význam","cz":"jídlo"},{"c":"交","role":"zvuk","cz":"jiāo"}],"pribeh":"Jídlo 饣 a 交 jiāo, který dává zvuk. Pomůcka: 交 je i „překřížit, spojit“, jako spojené okraje knedlíčku."},"茶":{"py":"chá","cz":"čaj","typ":"spojení","dil":false,"first":5,"trad":null,"dily":[{"c":"艹","role":"význam","cz":"rostlina"},{"c":"人","role":"význam","cz":"člověk"},{"c":"木","role":"význam","cz":"strom, keř"}],"pribeh":"Rostlina 艹 nahoře, člověk 人 uprostřed a keř 木 dole. Pomůcka: člověk mezi lístky a keřem, který sbírá čaj."},"水":{"py":"shuǐ","cz":"voda","typ":"obrázek","dil":false,"first":5,"trad":null,"dily":[],"pribeh":"Kresba tekoucího proudu s kapkami po stranách. Vlevo ve znaku má podobu 氵."},"啤":{"py":"pí","cz":"(pivo)","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"口","role":"význam","cz":"zvukový přepis"},{"c":"卑","role":"zvuk","cz":"bēi"}],"pribeh":"Mladý znak vytvořený pro přepis cizího slova „beer“, proto 口. 卑 bēi napoví výslovnost. 啤酒 = pivo."},"酒":{"py":"jiǔ","cz":"alkohol","typ":"spojení","dil":false,"first":5,"trad":null,"dily":[{"c":"氵","role":"význam","cz":"tekutina"},{"c":"酉","role":"zvuk","cz":"yǒu, džbán"}],"pribeh":"Džbán 酉 a tekutina 氵: víno, alkohol. 酉 sám kdysi znamenal víno a dodnes je v něm i zvuk."},"碗":{"py":"wǎn","cz":"miska","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"石","role":"význam","cz":"kámen"},{"c":"宛","role":"zvuk","cz":"wǎn"}],"pribeh":"Kámen 石 (mísy z kamene a keramiky) a 宛 wǎn, který dává přesný zvuk."},"杯":{"py":"bēi","cz":"šálek, sklenice","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"木","role":"význam","cz":"dřevo"},{"c":"不","role":"zvuk","cz":"bù"}],"pribeh":"Dřevo 木, protože první poháry byly dřevěné, a 不 bù, který dává zvuk."},"位":{"py":"wèi","cz":"místo; (zdvořile osoba)","typ":"spojení","dil":false,"first":5,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"立","role":"význam","cz":"stát"}],"pribeh":"Člověk 亻 stojí 立 na svém místě: místo, postavení. Odtud zdvořilé počítání osob: 两位."},"还":{"py":"hái","cz":"ještě","typ":"zjednodušený","dil":false,"first":5,"trad":"還","dily":[{"c":"辶","role":"význam","cz":"pohyb"},{"c":"不","role":"tvar","cz":"místo složitého zvukového dílu"}],"pribeh":"Tradiční 還 = pohyb 辶 + zvukový díl 睘 huán: vrátit se (dodnes huán). Zjednodušení dalo místo zvukového dílu jednoduché 不. Význam „ještě“ se čte hái."},"别":{"py":"bié","cz":"jiný; oddělit","typ":"spojení","dil":false,"first":5,"trad":null,"dily":[{"c":"另","role":"tvar","cz":"původně kost"},{"c":"刂","role":"význam","cz":"nůž"}],"pribeh":"Nůž 刂 odděluje maso od kosti: oddělit, rozlišit. Odtud „jiný“: 别的."},"辣":{"py":"là","cz":"pálivý","typ":"zvuk","dil":false,"first":5,"trad":null,"dily":[{"c":"辛","role":"význam","cz":"ostrý, pálivý"},{"c":"束","role":"zvuk","cz":"shù"}],"pribeh":"辛 xīn znamená ostrý a palčivý, 束 dodává zvuk."},"太":{"py":"tài","cz":"příliš","typ":"ukazatel","dil":false,"first":5,"trad":null,"dily":[{"c":"大","role":"význam","cz":"velký"},{"c":"丶","role":"význam","cz":"tečka navíc"}],"pribeh":"Velký 大 s tečkou navíc: ještě větší než velký, „příliš“."},"了":{"py":"le","cz":"(stalo se; změna)","typ":"výpůjčka","dil":false,"first":5,"trad":null,"dily":[],"pribeh":"Kresba dítěte v zavinovačce bez ruček (srovnej 子). Pro gramatickou částici si ho vypůjčili."},"买":{"py":"mǎi","cz":"koupit","typ":"zjednodušený","dil":false,"first":5,"trad":"買","dily":[],"pribeh":"Tradiční 買 = síť 罒 nad škeblí 貝 (peníze): získat zboží za peníze. Dnešní tvar je jen zkratka. Pozor na 卖 (prodat), který má nahoře 十 navíc."},"板":{"py":"bǎn","cz":"prkno","typ":"zvuk","dil":false,"first":6,"trad":null,"dily":[{"c":"木","role":"význam","cz":"dřevo"},{"c":"反","role":"zvuk","cz":"fǎn"}],"pribeh":"Dřevo 木 a 反 fǎn, který dává zvuk: prkno. V 老板 (šéf) je jen část ustáleného slova."},"衣":{"py":"yī","cz":"oblečení","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Kresba kabátu s límcem nahoře a rukávy. Vlevo ve znaku má podobu 衤."},"件":{"py":"jiàn","cz":"(kus; oblečení, záležitost)","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"牛","role":"význam","cz":"kráva"}],"pribeh":"Člověk 亻 a kráva 牛: rozdělit na kusy, kus. Pomůcka: člověk dělí krávu na jednotlivé kusy."},"多":{"py":"duō","cz":"hodně","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"夕","role":"tvar","cz":"kus masa"},{"c":"夕","role":"tvar","cz":"kus masa"}],"pribeh":"Dva stejné díly nad sebou, původně dva kusy masa: hodně. Pomůcka: mnoho večerů 夕."},"少":{"py":"shǎo","cz":"málo","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"小","role":"význam","cz":"malý"},{"c":"丿","role":"tvar","cz":"čárka"}],"pribeh":"Malý 小 s čárkou navíc, která ještě ubírá: málo. 多少 je „hodně-málo“, tedy kolik."},"钱":{"py":"qián","cz":"peníze","typ":"zvuk","dil":false,"first":6,"trad":"錢","dily":[{"c":"钅","role":"význam","cz":"kov"},{"c":"戋","role":"zvuk","cz":"jiān"}],"pribeh":"Kov 钅, protože mince byly z kovu, a 戋 jiān, který dává zvuk."},"块":{"py":"kuài","cz":"kus; jüan","typ":"zvuk","dil":false,"first":6,"trad":"塊","dily":[{"c":"土","role":"význam","cz":"hlína"},{"c":"夬","role":"zvuk","cz":"guài"}],"pribeh":"Hrouda hlíny 土: kus. Hovorově „kus“ peněz, tedy jüan."},"元":{"py":"yuán","cz":"jüan; začátek","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[{"c":"二","role":"tvar","cz":"zdůrazněná hlava"},{"c":"儿","role":"význam","cz":"člověk"}],"pribeh":"Člověk 儿 se zdůrazněnou hlavou: hlava, začátek, základ. Odtud základní jednotka měny."},"百":{"py":"bǎi","cz":"sto","typ":"zvuk","dil":false,"first":6,"trad":null,"dily":[{"c":"一","role":"význam","cz":"jedna"},{"c":"白","role":"zvuk","cz":"bái"}],"pribeh":"Jedna 一 a 白 bái, který dává zvuk: (jedna) stovka."},"贵":{"py":"guì","cz":"drahý","typ":"spojení","dil":false,"first":6,"trad":"貴","dily":[{"c":"中","role":"tvar","cz":"košík"},{"c":"一","role":"tvar","cz":"víko"},{"c":"贝","role":"význam","cz":"škeble, peníze"}],"pribeh":"Dole škeble 贝, tedy peníze, nahoře koš s věcmi. Pomůcka: na to potřebuješ hodně peněz, je to drahé."},"便":{"py":"pián","cz":"pohodlný; (v 便宜 levný)","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"更","role":"význam","cz":"změnit"}],"pribeh":"Člověk 亻 a 更 (změnit): člověk si věci upraví, jak se mu hodí, „pohodlný“ (čte se biàn). V 便宜 levný se čte pián."},"宜":{"py":"yí","cz":"vhodný","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"宀","role":"význam","cz":"střecha"},{"c":"且","role":"význam","cz":"obětní stolek"}],"pribeh":"Pod střechou 宀 obětní stolek s masem 且: vhodné, náležité. 便宜 je „pohodlné a přiměřené“, tedy levné."},"大":{"py":"dà","cz":"velký","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Kresba člověka s roztaženýma rukama a nohama: velký. Je i dílem jiných znaků: 天, 太."},"小":{"py":"xiǎo","cz":"malý","typ":"ukazatel","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Tři drobné tečky nebo zrnka: malý."},"颜":{"py":"yán","cz":"tvář; barva","typ":"zvuk","dil":false,"first":6,"trad":"顏","dily":[{"c":"彦","role":"zvuk","cz":"yàn"},{"c":"页","role":"význam","cz":"hlava"}],"pribeh":"Hlava 页 a 彦 yàn, který dává zvuk: obličej, tvář. Z „barvy tváře“ vzniklo 颜色 barva."},"色":{"py":"sè","cz":"barva","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Původně dva lidé, jeden nad druhým. Znamenal výraz a barvu tváře, později barvu vůbec."},"红":{"py":"hóng","cz":"červený","typ":"zvuk","dil":false,"first":6,"trad":"紅","dily":[{"c":"纟","role":"význam","cz":"hedvábí"},{"c":"工","role":"zvuk","cz":"gōng"}],"pribeh":"Hedvábí 纟, protože barvy se znaly z barvených látek, a 工 gōng, který dává zvuk."},"黑":{"py":"hēi","cz":"černý","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[{"c":"灬","role":"význam","cz":"oheň"}],"pribeh":"Kouřovod nebo okno začerněné sazemi nad ohněm 灬: černý."},"白":{"py":"bái","cz":"bílý","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Původ se vykládá různě (zrno, plamínek svíčky, nehet palce). Dnes bílý, jasný. Jako díl často dává zvuk: 百 bǎi."},"以":{"py":"yǐ","cz":"(v 可以, 所以)","typ":"výpůjčka","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Původně snad člověk, který nese nářadí: „použít, pomocí“. Dnes hlavně gramatické slovo: 可以 smět, 所以 proto."},"试":{"py":"shì","cz":"zkusit","typ":"zvuk","dil":false,"first":6,"trad":"試","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"式","role":"zvuk","cz":"shì"}],"pribeh":"Řeč 讠 a 式 shì (vzor, pravidlo), který dává zvuk: vyzkoušet, zkouška."},"卖":{"py":"mài","cz":"prodat","typ":"zjednodušený","dil":false,"first":6,"trad":"賣","dily":[{"c":"十","role":"tvar","cz":"zbytek 出 (vydat)"},{"c":"买","role":"význam","cz":"koupit"}],"pribeh":"Tradiční 賣 = 出 vydat + 買 koupit: vydat zboží, prodat. Zjednodušený tvar ponechal z 出 jen 十. Pomůcka: prodávající má navíc nahoře zisk."},"用":{"py":"yòng","cz":"použít","typ":"obrázek","dil":false,"first":6,"trad":null,"dily":[],"pribeh":"Původně kresba nádoby nebo dřevěného vědra, tedy věci k použití: používat."},"付":{"py":"fù","cz":"platit, dát","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"寸","role":"význam","cz":"ruka"}],"pribeh":"Ruka 寸 podává něco člověku 亻: dát, zaplatit. 付钱 = zaplatit."},"微":{"py":"wēi","cz":"drobný, mikro","typ":"zvuk","dil":false,"first":6,"trad":null,"dily":[{"c":"彳","role":"význam","cz":"krok"},{"c":"攵","role":"tvar","cz":"část zvukového dílu wēi"}],"pribeh":"Krok 彳 a zvukový díl: jít potichu, nenápadně. Odtud „drobný“. 微信 je doslova „mikrozpráva“."},"信":{"py":"xìn","cz":"důvěra; zpráva","typ":"spojení","dil":false,"first":6,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"言","role":"význam","cz":"slovo"}],"pribeh":"Člověk 亻 a jeho slovo 言: člověk stojí za tím, co řekl, důvěra. Odtud i dopis a zpráva."},"扫":{"py":"sǎo","cz":"zametat; naskenovat","typ":"zjednodušený","dil":false,"first":6,"trad":"掃","dily":[{"c":"扌","role":"význam","cz":"ruka"},{"c":"彐","role":"tvar","cz":"zbytek koštěte 帚"}],"pribeh":"Ruka 扌 a koště 帚, ze kterého zbylo jen 彐: zametat. Telefonem „přejedeš“ po kódu, proto i naskenovat."},"请":{"py":"qǐng","cz":"prosit; pozvat","typ":"zvuk","dil":false,"first":7,"trad":"請","dily":[{"c":"讠","role":"význam","cz":"řeč"},{"c":"青","role":"zvuk","cz":"qīng"}],"pribeh":"Řeč 讠 a 青 qīng, který dává zvuk: zdvořile poprosit. 请问 = dovolte otázku."},"问":{"py":"wèn","cz":"ptát se","typ":"zvuk","dil":false,"first":7,"trad":"問","dily":[{"c":"门","role":"zvuk","cz":"mén, dveře"},{"c":"口","role":"význam","cz":"ústa"}],"pribeh":"Ústa 口 ve dveřích 门: ptát se u dveří. 门 zároveň dává zvuk."},"地":{"py":"dì","cz":"země, půda","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"土","role":"význam","cz":"země"},{"c":"也","role":"zvuk","cz":"kdysi podobný zvuk"}],"pribeh":"Země 土 a 也, který dával zvuk. 地铁 je „podzemní železo“, metro."},"铁":{"py":"tiě","cz":"železo","typ":"zvuk","dil":false,"first":7,"trad":"鐵","dily":[{"c":"钅","role":"význam","cz":"kov"},{"c":"失","role":"zvuk","cz":"shī"}],"pribeh":"Kov 钅 a 失 shī, který dává zvuk. 地铁 = metro."},"站":{"py":"zhàn","cz":"stát; stanice","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"立","role":"význam","cz":"stát"},{"c":"占","role":"zvuk","cz":"zhàn"}],"pribeh":"Stát 立 a 占 zhàn, který dává přesný zvuk: místo, kde se stojí, stanice."},"银":{"py":"yín","cz":"stříbro","typ":"zvuk","dil":false,"first":7,"trad":"銀","dily":[{"c":"钅","role":"význam","cz":"kov"},{"c":"艮","role":"zvuk","cz":"gèn"}],"pribeh":"Kov 钅 a 艮 gèn, který dává zvuk. Stříbro bylo v Číně platidlem, proto 银行 banka („stříbrný obchod“)."},"行":{"py":"háng","cz":"jít; firma, řada","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[{"c":"彳","role":"význam","cz":"levá půlka křižovatky"},{"c":"亍","role":"význam","cz":"pravá půlka"}],"pribeh":"Kresba křižovatky dvou cest: jít, chodit (čte se xíng). V 银行 se čte háng a znamená obchod, řadu krámů u cesty."},"超":{"py":"chāo","cz":"přesáhnout, super","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"走","role":"význam","cz":"jít"},{"c":"召","role":"zvuk","cz":"zhào"}],"pribeh":"Jít 走 a 召 zhào, který dává zvuk: přeskočit, překonat. 超市 je „super trh“."},"市":{"py":"shì","cz":"trh; město","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[],"pribeh":"Původně tržiště, nad kterým visí prapor: trh. Z trhu se stalo i město."},"洗":{"py":"xǐ","cz":"mýt","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"氵","role":"význam","cz":"voda"},{"c":"先","role":"zvuk","cz":"xiān"}],"pribeh":"Voda 氵 a 先 xiān, který dává zvuk. 洗手间 je „místnost na mytí rukou“, toaleta."},"手":{"py":"shǒu","cz":"ruka","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[],"pribeh":"Kresba ruky s roztaženými prsty. Vlevo ve znaku má podobu 扌."},"间":{"py":"jiān","cz":"mezi; místnost","typ":"spojení","dil":false,"first":7,"trad":"間","dily":[{"c":"门","role":"význam","cz":"dveře"},{"c":"日","role":"význam","cz":"slunce (tradičně měsíc)"}],"pribeh":"Škvírou mezi dveřmi 门 prosvítá slunce 日, v tradiční podobě měsíc 月: mezera, prostor mezi. Odtud místnost: 洗手间."},"旁":{"py":"páng","cz":"strana, vedle","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"立","role":"tvar","cz":"horní část"},{"c":"方","role":"zvuk","cz":"fāng, strana"}],"pribeh":"Dole 方 fāng (strana), který dává i zvuk: po straně, vedle. 旁边 = vedle."},"边":{"py":"biān","cz":"okraj, strana","typ":"zjednodušený","dil":false,"first":7,"trad":"邊","dily":[{"c":"辶","role":"význam","cz":"pohyb"},{"c":"力","role":"tvar","cz":"místo složitého zvukového dílu"}],"pribeh":"Pohyb 辶 až k okraji. Tradiční 邊 měl vpravo složitý zvukový díl, zjednodušení ho nahradilo 力. 左边 levá strana."},"前":{"py":"qián","cz":"vpředu","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[],"pribeh":"Původně noha 止 na lodi: plout vpřed. Dnešní tvar to už nepřipomíná. 前面 = vpředu."},"后":{"py":"hòu","cz":"vzadu; potom","typ":"zjednodušený","dil":false,"first":7,"trad":"後","dily":[],"pribeh":"Pro „vzadu“ se tradičně psalo 後 (krok 彳 a malé, zdržované kroky). Zjednodušení ho sloučilo se starým znakem 后 (královna), který zněl stejně."},"左":{"py":"zuǒ","cz":"vlevo","typ":"spojení","dil":false,"first":7,"trad":null,"dily":[{"c":"又","role":"význam","cz":"levá ruka (zkrácená na dva tahy)"},{"c":"工","role":"význam","cz":"nástroj"}],"pribeh":"Levá ruka, která drží nástroj 工: levá ruka pomáhá při práci. Srovnej s 右."},"右":{"py":"yòu","cz":"vpravo","typ":"spojení","dil":false,"first":7,"trad":null,"dily":[{"c":"又","role":"význam","cz":"pravá ruka (zkrácená na dva tahy)"},{"c":"口","role":"význam","cz":"ústa"}],"pribeh":"Ruka a ústa 口: pravá ruka, která nosí jídlo k ústům. Srovnej s 左."},"附":{"py":"fù","cz":"přilehlý, poblíž","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"阝","role":"význam","cz":"kopec"},{"c":"付","role":"zvuk","cz":"fù"}],"pribeh":"Kopec 阝 a 付 fù, který dává přesný zvuk: malý kopec u většího, přilehlý. 附近 = poblíž."},"近":{"py":"jìn","cz":"blízko","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"辶","role":"význam","cz":"chůze"},{"c":"斤","role":"zvuk","cz":"jīn"}],"pribeh":"Chůze 辶 a 斤 jīn, který dává zvuk: dojdeš tam kousek, blízko."},"离":{"py":"lí","cz":"od, vzdálit se","typ":"zjednodušený","dil":false,"first":7,"trad":"離","dily":[],"pribeh":"Tradiční 離 byl název ptáka 隹; levá část dávala zvuk lí. Slovo „vzdálit se“ znělo stejně a vypůjčilo si ho. Zjednodušení ponechalo jen zvukovou část."},"远":{"py":"yuǎn","cz":"daleko","typ":"zvuk","dil":false,"first":7,"trad":"遠","dily":[{"c":"辶","role":"význam","cz":"chůze"},{"c":"元","role":"zvuk","cz":"yuán"}],"pribeh":"Chůze 辶 a 元 yuán, který dává zvuk: jít dlouho, daleko."},"走":{"py":"zǒu","cz":"jít","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[{"c":"土","role":"tvar","cz":"člověk s rozmáchlýma rukama"},{"c":"止","role":"význam","cz":"noha"}],"pribeh":"Nahoře člověk s rozmáchlýma rukama (dnes vypadá jako 土), dole noha 止: rychle jít, běžet. Dnes znamená „jít“."},"路":{"py":"lù","cz":"cesta","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"足","role":"význam","cz":"noha"},{"c":"各","role":"zvuk","cz":"gè"}],"pribeh":"Noha 足 a 各 gè, který dává zvuk: cesta, po které se chodí. 走路 = jít pěšky."},"钟":{"py":"zhōng","cz":"zvon; hodiny","typ":"zvuk","dil":false,"first":7,"trad":"鐘","dily":[{"c":"钅","role":"význam","cz":"kov"},{"c":"中","role":"zvuk","cz":"zhōng"}],"pribeh":"Kov 钅 a 中 zhōng, který dává přesný zvuk: kovový zvon. Zvony odbíjely čas, odtud hodiny a 分钟 minuta."},"怎":{"py":"zěn","cz":"jak (v 怎么)","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"乍","role":"zvuk","cz":"zhà"},{"c":"心","role":"význam","cz":"mysl"}],"pribeh":"Mysl 心 (přemýšlíš, jak na to) a 乍 zhà, který dává zvuk."},"直":{"py":"zhí","cz":"rovný, přímo","typ":"spojení","dil":false,"first":7,"trad":null,"dily":[{"c":"十","role":"tvar","cz":"čára"},{"c":"目","role":"význam","cz":"oko"}],"pribeh":"Oko 目 a nad ním svislá čára: dívat se přímo před sebe, rovně. 一直 = pořád rovně."},"往":{"py":"wǎng","cz":"směrem k","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"彳","role":"význam","cz":"krok"},{"c":"主","role":"zvuk","cz":"původně 王 wáng"}],"pribeh":"Krok 彳 a zvukový díl, který býval 王 wáng: jít někam, směrem k."},"拐":{"py":"guǎi","cz":"zabočit","typ":"spojení","dil":false,"first":7,"trad":null,"dily":[{"c":"扌","role":"význam","cz":"ruka"},{"c":"另","role":"význam","cz":"jiný"}],"pribeh":"Ruka 扌 a 另 (jiný). Pomůcka: rukou ukazuješ jiným směrem, zahni."},"到":{"py":"dào","cz":"dojít k, přijet","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"至","role":"význam","cz":"dorazit"},{"c":"刂","role":"zvuk","cz":"dāo"}],"pribeh":"至 zhì je šíp, který dopadl na zem: dorazit. 刂 dāo (nůž) tu dává zvuk."},"绿":{"py":"lǜ","cz":"zelený","typ":"zvuk","dil":false,"first":7,"trad":"綠","dily":[{"c":"纟","role":"význam","cz":"hedvábí"},{"c":"录","role":"zvuk","cz":"lù"}],"pribeh":"Hedvábí 纟 (barvené látky) a 录 lù, který dává zvuk. Stejně jako 红 červený."},"灯":{"py":"dēng","cz":"světlo, lampa","typ":"zvuk","dil":false,"first":7,"trad":"燈","dily":[{"c":"火","role":"význam","cz":"oheň"},{"c":"丁","role":"zvuk","cz":"dīng"}],"pribeh":"Oheň 火 a 丁 dīng, který dává zvuk. 红绿灯 je „červeno-zelené světlo“, semafor."},"去":{"py":"qù","cz":"jít (pryč)","typ":"obrázek","dil":false,"first":7,"trad":null,"dily":[{"c":"土","role":"tvar","cz":"původně člověk"},{"c":"厶","role":"tvar","cz":"původně otvor"}],"pribeh":"Původně člověk 大, který vychází z otvoru: odejít, jít pryč. Dnešní tvar to už nepřipomíná."},"客":{"py":"kè","cz":"host","typ":"zvuk","dil":false,"first":7,"trad":null,"dily":[{"c":"宀","role":"význam","cz":"střecha"},{"c":"各","role":"zvuk","cz":"gè, každý"}],"pribeh":"Střecha 宀 a 各 gè, který dává zvuk: ten, kdo přišel pod tvou střechu, host. 客气 je zdvořilost hosta."},"气":{"py":"qì","cz":"vzduch, dech","typ":"obrázek","dil":false,"first":7,"trad":"氣","dily":[],"pribeh":"Tři vlnky páry nebo mraků: vzduch, dech, nálada. Tradiční 氣 má navíc rýži 米: pára z vařené rýže."},"喜":{"py":"xǐ","cz":"radost","typ":"spojení","dil":false,"first":8,"trad":null,"dily":[{"c":"壴","role":"význam","cz":"buben"},{"c":"口","role":"význam","cz":"ústa"}],"pribeh":"Buben 壴 nahoře a ústa 口, která zpívají: radost, veselí. 喜欢 = mít rád."},"欢":{"py":"huān","cz":"radostný","typ":"zjednodušený","dil":false,"first":8,"trad":"歡","dily":[{"c":"又","role":"tvar","cz":"místo zvukového dílu"},{"c":"欠","role":"význam","cz":"člověk s otevřenou pusou"}],"pribeh":"Vpravo 欠: člověk s otevřenou pusou (směje se). Vlevo v tradiční podobě zvukový díl, zjednodušený na 又."},"周":{"py":"zhōu","cz":"týden; okolo","typ":"obrázek","dil":false,"first":8,"trad":null,"dily":[],"pribeh":"Původně pole rozdělené na políčka: všude kolem, okruh. Odtud i týden jako okruh dní: 周末 konec týdne."},"末":{"py":"mò","cz":"konec","typ":"ukazatel","dil":false,"first":8,"trad":null,"dily":[{"c":"木","role":"význam","cz":"strom"},{"c":"一","role":"význam","cz":"čára u špičky"}],"pribeh":"Strom 木 s čárou nahoře u špičky: vršek, konec. Srovnej 本 s čárou dole u kořenů: základ."},"做":{"py":"zuò","cz":"dělat","typ":"spojení","dil":false,"first":8,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"故","role":"zvuk","cz":"gù, příčina"}],"pribeh":"Člověk 亻 a 故 (příčina), který dává i zvuk: člověk, který věci způsobuje, dělá."},"常":{"py":"cháng","cz":"často, stálý","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"尚","role":"zvuk","cz":"shàng"},{"c":"巾","role":"význam","cz":"látka"}],"pribeh":"Původně dlouhá suknice z látky 巾, 尚 shàng dává zvuk. Odtud „dlouhý, stálý, obvyklý“: 常常 často."},"时":{"py":"shí","cz":"čas","typ":"zvuk","dil":false,"first":8,"trad":"時","dily":[{"c":"日","role":"význam","cz":"slunce"},{"c":"寸","role":"tvar","cz":"zbytek zvukového dílu 寺"}],"pribeh":"Slunce 日 měří čas. Tradiční 時 měl vpravo 寺 sì, který dával zvuk, zjednodušení ponechalo jen 寸."},"候":{"py":"hòu","cz":"chvíle; čekat","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"亻","role":"význam","cz":"člověk"},{"c":"矦","role":"zvuk","cz":"hóu"}],"pribeh":"Člověk 亻 a 矦 hóu, který dává zvuk: čekat, chvíle. 时候 = doba, chvíle."},"运":{"py":"yùn","cz":"pohyb; převážet","typ":"zvuk","dil":false,"first":8,"trad":"運","dily":[{"c":"辶","role":"význam","cz":"pohyb"},{"c":"云","role":"zvuk","cz":"yún"}],"pribeh":"Pohyb 辶 a 云 yún (mrak), který dává zvuk: pohybovat se, převážet. 运动 = sport, pohyb."},"动":{"py":"dòng","cz":"hýbat se","typ":"zvuk","dil":false,"first":8,"trad":"動","dily":[{"c":"云","role":"tvar","cz":"místo 重 (těžký)"},{"c":"力","role":"význam","cz":"síla"}],"pribeh":"Síla 力 pohne věcmi. Tradiční 動 měl vlevo 重 zhòng (těžký), který dával zvuk."},"跑":{"py":"pǎo","cz":"běžet","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"足","role":"význam","cz":"noha"},{"c":"包","role":"zvuk","cz":"bāo"}],"pribeh":"Noha 足 a 包 bāo, který dává zvuk. 跑步 = běhat."},"步":{"py":"bù","cz":"krok","typ":"obrázek","dil":false,"first":8,"trad":null,"dily":[{"c":"止","role":"význam","cz":"noha"},{"c":"少","role":"tvar","cz":"druhá noha"}],"pribeh":"Dvě chodidla za sebou, jedno před druhým: krok. Horní 止 je jedno chodidlo, spodní část je druhé."},"踢":{"py":"tī","cz":"kopat","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"足","role":"význam","cz":"noha"},{"c":"易","role":"zvuk","cz":"yì"}],"pribeh":"Noha 足 a 易 yì, který dává zvuk: kopat nohou."},"足":{"py":"zú","cz":"noha","typ":"obrázek","dil":false,"first":8,"trad":null,"dily":[],"pribeh":"Kresba nohy: nahoře koleno 口, dole chodidlo. Vlevo ve znaku má podobu ⻊: 跑, 踢, 路, 跟. 足球 je „nohomíč“, fotbal."},"球":{"py":"qiú","cz":"míč","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"王","role":"význam","cz":"nefrit"},{"c":"求","role":"zvuk","cz":"qiú"}],"pribeh":"Nefrit 王 (původně kulatý drahokam) a 求 qiú, který dává přesný zvuk: koule, míč."},"看":{"py":"kàn","cz":"dívat se","typ":"spojení","dil":false,"first":8,"trad":null,"dily":[{"c":"手","role":"význam","cz":"ruka"},{"c":"目","role":"význam","cz":"oko"}],"pribeh":"Ruka 手 nad okem 目: člověk si dává dlaň nad oči a dívá se do dálky."},"书":{"py":"shū","cz":"kniha","typ":"zjednodušený","dil":false,"first":8,"trad":"書","dily":[],"pribeh":"Tradiční 書 je ruka se štětcem 聿 nad 曰 (mluvit): zapisovat řeč, psát. Zjednodušený tvar vznikl z kurzivního psaní."},"电":{"py":"diàn","cz":"elektřina","typ":"zjednodušený","dil":false,"first":8,"trad":"電","dily":[],"pribeh":"Tradiční 電 je déšť 雨 nad bleskem 申: blesk. Zjednodušený tvar ponechal jen blesk. Elektřina je „blesk“, 电影 „elektrický stín“, film."},"影":{"py":"yǐng","cz":"stín, obraz","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"景","role":"zvuk","cz":"jǐng, světlo, krajina"},{"c":"彡","role":"význam","cz":"paprsky"}],"pribeh":"景 jǐng (světlo, krajina) dává zvuk, 彡 jsou paprsky: stín, který světlo vrhá, obraz."},"听":{"py":"tīng","cz":"poslouchat","typ":"zjednodušený","dil":false,"first":8,"trad":"聽","dily":[{"c":"口","role":"význam","cz":"ústa"},{"c":"斤","role":"zvuk","cz":"jīn"}],"pribeh":"Tradiční 聽 má ucho 耳 a srdce 心: poslouchat uchem i srdcem. Zjednodušený 听 = ústa 口 + 斤 jīn."},"音":{"py":"yīn","cz":"zvuk, tón","typ":"ukazatel","dil":false,"first":8,"trad":null,"dily":[{"c":"立","role":"tvar","cz":"horní část"},{"c":"日","role":"tvar","cz":"ústa s čárkou"}],"pribeh":"Původně znak 言 řeč s čárkou v ústech: zvuk, který z úst vychází. 音乐 = hudba."},"乐":{"py":"yuè","cz":"hudba; radost (lè)","typ":"zjednodušený","dil":false,"first":8,"trad":"樂","dily":[],"pribeh":"Tradiční 樂 je hudební nástroj: struny na dřevěném stojanu 木. Odtud hudba (yuè) a radost (lè)."},"旅":{"py":"lǚ","cz":"cesta, cestovat","typ":"obrázek","dil":false,"first":8,"trad":null,"dily":[{"c":"方","role":"tvar","cz":"praporec"},{"c":"氏","role":"tvar","cz":"lidé pod praporem"}],"pribeh":"Lidé, kteří jdou pod praporem: vojenská jednotka na pochodu, odtud cestovat. 旅游 = cestovat."},"游":{"py":"yóu","cz":"plavat; putovat","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"氵","role":"význam","cz":"voda"},{"c":"斿","role":"zvuk","cz":"yóu, vlající prapor"}],"pribeh":"Voda 氵 a 斿 yóu, prapor vlající ve větru, který dává i zvuk: plavat, volně putovat."},"朋":{"py":"péng","cz":"přítel","typ":"obrázek","dil":false,"first":8,"trad":null,"dily":[{"c":"月","role":"tvar","cz":"šňůra mušlí"},{"c":"月","role":"tvar","cz":"šňůra mušlí"}],"pribeh":"Dvě šňůry mušlí vedle sebe (dnes vypadají jako 月 月): pár, dvojice, přátelé."},"友":{"py":"yǒu","cz":"přítel","typ":"spojení","dil":false,"first":8,"trad":null,"dily":[{"c":"又","role":"význam","cz":"ruka (zkrácená na dva tahy)"},{"c":"又","role":"význam","cz":"ruka"}],"pribeh":"Dvě pravé ruce vedle sebe: lidé, kteří si pomáhají, přátelé. 朋友 = kamarád."},"跟":{"py":"gēn","cz":"pata; s (někým)","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"足","role":"význam","cz":"noha"},{"c":"艮","role":"zvuk","cz":"gèn"}],"pribeh":"Noha 足 a 艮 gèn, který dává zvuk: pata. Kdo ti jde v patách, jde s tebou: 跟朋友 s kamarádem."},"打":{"py":"dǎ","cz":"bít; dělat","typ":"zvuk","dil":false,"first":8,"trad":null,"dily":[{"c":"扌","role":"význam","cz":"ruka"},{"c":"丁","role":"zvuk","cz":"dīng, hřebík"}],"pribeh":"Ruka 扌 a 丁 dīng (hřebík), který dává zvuk: tlouct. Dnes obecně dělat něco rukama: 打算 plánovat."},"算":{"py":"suàn","cz":"počítat","typ":"spojení","dil":false,"first":8,"trad":null,"dily":[{"c":"竹","role":"význam const STORE_KEY = 'cinstina-krok-za-krokem/pokrok';

function loadJSON(key, fallback) {

}
function saveJSON(key, value) {

function normalizeProgress(p) {
  const base = emptyProgress();
  if (!p || typeof p !== 'object') return base;
  for (const k of Object.keys(base)) if (p[k] != null) base[k] = p[k];
  base.known = { w: Object.assign({}, p.known && p.known.w), c: Object.assign({}, p.known && p.known.c) };
  return base;
}

// Spojí dva stavy (místní a uložený u účtu) tak, aby se nic neztratilo.
function mergeProgress(a, b) {
  if ((a.epoch || 0) !== (b.epoch || 0)) return (a.epoch || 0) > (b.epoch || 0) ? a : b;
  const pickNewer = (x, y) => (!x ? y : !y ? x : (x.t || 0) >= (y.t || 0) ? x : y);
  const out = emptyProgress();
  out.epoch = a.epoch || 0;
  out.t = Math.max(a.t || 0, b.t || 0);
  out.steps = Object.assign({}, a.steps, b.steps);
  for (const k of new Set([...Object.keys(a.ex), ...Object.keys(b.ex)])) {

    const y = b.ex[k];
    out.ex[k] = x && y && x.ok !== y.ok ? (x.ok ? x : y) : pickNewer(x, y);
  }
  for (const k of new Set([...Object.keys(a.cards), ...Object.keys(b.cards)])) out.cards[k] = pickNewer(a.cards[k], b.cards[k]);
  for (const k of new Set([...Object.keys(a.notes), ...Object.keys(b.notes)])) out.notes[k] = pickNewer(a.notes[k], b.notes[k]);

    const x = (a.known && a.known[kind]) || {};
    const y = (b.known && b.known[kind]) || {};

const stepId = (n, key) => `l${n}:${key}`;

const DAY = 86400000;

function shuffle(arr, seed) {

function plural(n, one, few, many) {

// src/js/pinyin.js
// Pinyin: rozdělení na slabiky, určení tónu a obarvení podle tónu.

const TONE_MARKS = {

const MARKED = {};

    MARKED[m] = { base, tone: i + 1 };
    MARKED[m.toUpperCase()] = { base: base.toUpperCase(), tone: i + 1 };
  });

const SYLLABLE = /^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?(iang|iong|uang|ang|eng|ing|ong|uai|iao|ian|uan|üan|ai|ei|ao|ou|an|en|in|un|ün|ia|ie|iu|ua|uo|ui|üe|ue|er|a|o|e|i|u|ü)$/;

function splitWord(word) {

  const n = base.length;
  const best = new Array(n + 1).fill(null);
  best[0] = [];
  for (let i = 1; i <= n; i++) {
    for (let j = Math.max(0, i - 7); j < i; j++) {
      if (!best[j] || !isSyllable(base.slice(j, i))) continue;
      const cand = best[j].concat([[j, i]]);
      if (!best[i] || cand.length < best[i].length) best[i] = cand;

function pyHtml(py) {
  const out = [];
  let i = 0;

function setTone(text, tone) {
  const plainText = stripTones(text);
  if (tone === 5) return plainText;
  const lower = plainText.toLowerCase();
  let idx = lower.search(/[ae]/);
  if (idx < 0) idx = lower.indexOf('ou');

    for (let k = lower.length - 1; k >= 0; k--) {

  const marks = TONE_MARKS[ch.toLowerCase()];
  let m = marks[tone - 1];
  if (ch !== ch.toLowerCase()) m = m.toUpperCase();
  return plainText.slice(0, idx) + m + plainText.slice(idx + 1);

// Výslovnost přes hlasovou syntézu prohlížeče (Web Speech API).

const Speech = {
  supported: typeof window.speechSynthesis !== 'undefined' && typeof window.SpeechSynthesisUtterance !== 'undefined',
  voices: [],

  init() {

    const load = () => {
      const all = speechSynthesis.getVoices();
      this.voices = all.filter((v) => /^(zh|cmn)/i.test(v.lang) && !/HK|yue/i.test(v.lang));
      if (all.length) this.loaded = true;

        done: () => {

function onlyHanText(text) {

  const btn = h('button', {

    class: `say ${opts.small ? 'say-sm' : ''}`,
    'aria-label': opts.label || `Přehrát: ${onlyHanText(text)}`,
    title: 'Přehrát',
    html: ICONS.play,
  });
  btn.addEventListener('click', async (e) => {
    e.stopPropagation();
    btn.classList.add('playing');
    await Speech.speak(text, opts);
    btn.classList.remove('playing');
  });
  return btn;
}

// V daném prvku obalí souvislé úseky čínštiny, aby šly přehrát klepnutím.
function makeSayable(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!hasHan(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      if (node.parentElement.closest('.hz-say, button, .no-say, .tzg')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0;
    for (const m of text.matchAll(HAN_RUN)) {
      if (m.index > last) frag.append(text.slice(last, m.index));
      frag.append(h('span', { class: 'hz-say zh', 'data-say': m[0], title: 'Klepni pro výslovnost' }, m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.append(text.slice(last));
    node.replaceWith(frag);
  }
  return root;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-say]');
  if (!el) return;
  Speech.speak(el.getAttribute('data-say'));
});

// src/js/sync.js
// Ukládání pokroku k účtu, když aplikace běží na claude.ai.
// Jinde (GitHub Pages, otevřený soubor) zůstává pokrok jen v prohlížeči.

const Sync = {
  ref: null,
  active: false,
  timer: 0,
  writing: false,
  pending: false,
  listeners: new Set(),

  status() {
    return this.active
      ? 'Pokrok se ukládá k tvému účtu, takže ho uvidíš i na dalších zařízeních.'
      : 'Pokrok se ukládá v tomhle prohlížeči.';
  },

  async init(onMerged) {
    const claude = window.claude;
    if (!claude || typeof claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.ref = db.doc(`data/users/${id}/pokrok`);
      const snap = await this.ref.get();
      const remote = snap.exists && snap.data() && snap.data().state ? normalizeProgress(JSON.parse(JSON.stringify(snap.data().state))) : null;
      this.active = true;
      if (remote) {
        const merged = mergeProgress(progress, remote);
        const changedLocal = JSON.stringify(merged) !== JSON.stringify(progress);
        const changedRemote = JSON.stringify(merged) !== JSON.stringify(remote);
        progress = merged;
        saveJSON(STORE_KEY, progress);
        if (changedLocal && onMerged) onMerged();
        if (changedRemote) this.schedule(0);
      } else if (progress.t) {
        this.schedule(0);
      }
      this.listeners.forEach((fn) => fn());
    } catch (e) {
      this.active = false;
    }
  },

  schedule(delay = 2500) {
    if (!this.active) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.push(), delay);
  },

  async push() {
    if (!this.active || !this.ref) return;
    if (this.writing) { this.pending = true; return; }
    this.writing = true;
    try {
      await this.ref.set({ state: JSON.parse(JSON.stringify(progress)), savedAt: Date.now() });
    } catch (e) {
      if (e && e.code === 'unavailable' && !this.retried) {
        this.retried = true;
        this.pending = true;
      } else {
        // Bez práva zápisu zůstane pokrok jen v prohlížeči.
        this.active = false;
        this.listeners.forEach((fn) => fn());
      }
    }
    this.writing = false;
    if (this.pending) { this.pending = false; this.schedule(500); }
  },
};

// Křivka tónu podle Čaovy stupnice (5 = vysoko, 1 = nízko).
const CONTOURS = { 1: [5, 5], 2: [3, 5], 3: [2, 1, 4], 4: [5, 1], 5: null };
function contourSvg(tone) {
  const W = 64;
  const H = 44;
  const y = (lvl) => 4 + (5 - lvl) * 9;
  const levels = [1, 2, 3, 4, 5].map((l) => `<line class="lvl" x1="4" x2="${W - 4}" y1="${y(l)}" y2="${y(l)}"/>`).join('');
  const pts = CONTOURS[tone];
  let mark;
  if (!pts) mark = `<circle cx="${W / 2}" cy="${y(3)}" r="4.5"/>`;
  else {
    const d = pts.length === 3
      ? `M8 ${y(pts[0])} Q26 ${y(pts[1]) + 12} ${W - 8} ${y(pts[2])}`
      : `M8 ${y(pts[0])} L${W - 8} ${y(pts[1])}`;
    mark = `<path d="${d}"/>`;
  }
  return `<svg class="contour tc${tone}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${tone === 5 ? 'neutrální tón' : `${tone}. tón`}">${levels}${mark}</svg>`;
}

// ---------- Psaní znaků (Hanzi Writer) ----------
const Writer = {
  dlg: null,
  writer: null,
  chars: [],
  index: 0,

  open(chars, start = 0) {
    this.chars = [...new Set([...chars].filter((c) => STROKES[c]))];
    if (!this.chars.length) { toast('Pro tenhle znak nemám data o tazích.'); return; }
    this.index = Math.max(0, this.chars.indexOf([...chars][start]));
    this.dlg = $('#writer');
    this.render();
    if (!this.dlg.open) this.dlg.showModal();
  },

  render() {
    const c = this.chars[this.index];
    const word = COURSE.vocab.find((v) => v.zh === c);
    const py = word ? word.py : COURSE.pinyin[c] || '';
    const status = h('p', { class: 'writer-status', 'aria-live': 'polite' }, 'Klepni na „Ukaž tahy“, nebo zkus znak napsat sám.');
    const target = h('div', { class: 'writer-target', id: 'writer-target' });
    const close = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Zavřít', html: ICONS.close, onclick: () => this.close() });
    const head = h('div', { class: 'dlg-head' },
      h('div', null, h('h2', { id: 'writer-title' }, 'Psaní znaku ', h('span', { class: 'zh' }, c)),
        h('div', { class: 'row' }, py ? pyEl(py) : null, word ? h('span', { class: 'muted' }, `· ${word.cz}`) : null)),
      close);
    const animate = h('button', { class: 'btn', type: 'button', onclick: () => this.animate(status) }, 'Ukaž tahy');
    const quiz = h('button', { class: 'btn btn-primary', type: 'button', onclick: () => this.quiz(status) }, h('span', { html: ICONS.brush, style: 'display:contents' }), 'Napiš sám');
    const picker = this.chars.length > 1
      ? h('div', { class: 'writer-chars', role: 'group', 'aria-label': 'Vyber znak' }, this.chars.map((ch, i) =>
        h('button', { type: 'button', 'aria-pressed': String(i === this.index), onclick: () => { this.index = i; this.render(); } }, ch)))
      : null;
    this.dlg.replaceChildren(head, h('div', { class: 'dlg-body' },
      h('div', { class: 'writer-box' }, target, status, h('div', { class: 'row' }, sayBtn(c), animate, quiz), picker)));
    this.mount(target, c, status);
  },

  mount(target, c, status) {
    this.writer = null;
    if (!window.HanziWriter) {
      target.append(h('span', { class: 'tzg', style: '--s:236px;border:0;background:transparent' }, c));
      status.textContent = 'Animace tahů potřebuje připojení k internetu (knihovna Hanzi Writer se nenačetla).';
      return;
    }
    const css = getComputedStyle(document.documentElement);
    const color = (name) => css.getPropertyValue(name).trim();
    this.writer = window.HanziWriter.create(target, c, {
      width: 236,
      height: 236,
      padding: 14,
      showOutline: true,
      showCharacter: false,
      strokeAnimationSpeed: 1.2,
      delayBetweenStrokes: 220,
      strokeColor: color('--ink'),
      outlineColor: color('--grid-faint'),
      highlightColor: color('--grid'),
      drawingColor: color('--seal'),
      drawingWidth: 18,
      charDataLoader: (ch, done) => done(STROKES[ch]),
    });
    this.writer.showCharacter();
  },

  animate(status) {
    if (!this.writer) return;
    const total = STROKES[this.chars[this.index]].strokes.length;
    status.textContent = `${plural(total, 'tah', 'tahy', 'tahů')}, sleduj pořadí.`;
    this.writer.hideCharacter();
    this.writer.animateCharacter();
  },

  quiz(status) {
    if (!this.writer) return;
    const total = STROKES[this.chars[this.index]].strokes.length;
    status.textContent = `Napiš znak tahem prstu nebo myší. Celkem ${plural(total, 'tah', 'tahy', 'tahů')}.`;
    this.writer.hideCharacter();
    this.writer.quiz({
      showHintAfterMisses: 2,
      onCorrectStroke: (d) => { status.textContent = `Tah ${d.strokeNum + 1} z ${total}: správně.`; },
      onMistake: (d) => { status.textContent = `Tah ${d.strokeNum + 1} z ${total}: zkus to znovu${d.mistakesOnStroke >= 2 ? ', nápověda svítí' : ''}.`; },
      onComplete: (d) => {
        status.textContent = d.totalMistakes ? `Hotovo! Chyb celkem: ${d.totalMistakes}.` : 'Hotovo bez chyby!';
      },
    });
  },

  close() {
    if (this.writer && this.writer.cancelQuiz) this.writer.cancelQuiz();
    this.dlg.close();
  },
};

function nextStep() {
  const last = progress.last;
  if (last && lessonByN(last.n)) {
    const idx = STEPS.findIndex((s) => s.key === last.step);
    return { n: last.n, step: STEPS[Math.max(idx, 0)] };
  }
  for (const l of LESSONS) {
    const s = STEPS.find((st) => !isStepDone(l.n, st.key));
    if (s) return { n: l.n, step: s };
  }
  return null;
}

// „Po téhle lekci se umíš pozdravit…“ → „Umíš se pozdravit…“
function shortGoal(lesson) {
  const text = lesson.goal[0] ? lesson.goal[0].text : '';
  const rest = text.replace(/^Po téhle lekci /, '');
  if (rest === text) return text;
  const m = /^(se|si) (\S+)(.*)$/.exec(rest);
  const out = m ? `${m[2]} ${m[1]}${m[3]}` : rest;
  return out.charAt(0).toUpperCase() + out.slice(1);
}

function vocabStats() {
  const now = today();
  let due = 0;
  for (const v of COURSE.vocab) {
    const c = progress.cards[cardKey(v)];
    if (c && c.due <= now) due++;
  }
  const chars = CHAR_ORDER.filter((c) => !CHARS[c].dil);
  return {
    learned: COURSE.vocab.filter(isKnownWord).length,
    due,
    total: COURSE.vocab.length,
    chars: chars.filter(isKnownChar).length,
    charsTotal: chars.length,
  };
}
