// Lekce: sedm kroků od dialogu po cvičení.

let leaveHandlers = [];
const onLeave = (fn) => leaveHandlers.push(fn);
function runLeave() {
  leaveHandlers.forEach((fn) => { try { fn(); } catch (e) { /* nic */ } });
  leaveHandlers = [];
}

function LessonView(n, slug) {
  const lesson = lessonByN(n);
  if (!lesson) return NotFoundView();
  let step = STEPS.find((s) => s.slug === slug);
  if (!step) {
    const last = progress.last && progress.last.n === n ? STEPS.find((s) => s.key === progress.last.step) : null;
    step = last || STEPS.find((s) => !isStepDone(n, s.key)) || STEPS[0];
  }
  setLast(n, step.key);
  const idx = STEPS.indexOf(step);

  const head = h('header', { class: 'lesson-head' },
    h('div', null,
      h('span', { class: 'eyebrow' }, `Lekce ${n} z ${LESSONS.length}`),
      h('h1', null, lesson.title),
      h('p', null, lesson.goal.map((g) => g.text).join(' '))),
    h('button', { class: 'tzg-row', type: 'button', style: 'border:0;background:none;padding:0;cursor:pointer', 'aria-label': `Přehrát ${lesson.key} ${lesson.keyPy}`, onclick: () => Speech.speak(lesson.key) },
      [...lesson.key].map((c) => h('span', { class: 'tzg' }, c))));

  const nav = h('nav', { class: 'steps', 'aria-label': 'Kroky lekce' }, STEPS.map((s, i) =>
    h('a', {
      href: `#l${n}-${s.slug}`,
      class: isStepDone(n, s.key) ? 'done' : null,
      'aria-current': s === step ? 'step' : null,
    }, h('span', { class: 'num', html: isStepDone(n, s.key) ? ICONS.check.replace('<svg', '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="3"') : String(i + 1) }), s.label)));

  const renderers = {
    dialog: renderDialog, vocab: renderVocab, grammar: renderGrammar, chars: renderChars,
    pron: renderPron, speak: renderSpeak, ex: renderExercises,
  };
  const body = renderers[step.key](lesson);

  const prev = idx > 0
    ? h('a', { class: 'btn', href: `#l${n}-${STEPS[idx - 1].slug}` }, h('span', { html: ICONS.arrowL, style: 'display:contents' }), STEPS[idx - 1].label)
    : n > 1 ? h('a', { class: 'btn', href: `#l${n - 1}-cviceni` }, h('span', { html: ICONS.arrowL, style: 'display:contents' }), `Lekce ${n - 1}`) : h('span');
  let next;
  if (step.key === 'ex') {
    next = n < LESSONS.length
      ? h('a', { class: 'btn btn-primary', href: `#l${n + 1}-dialog` }, `Lekce ${n + 1}: ${lessonByN(n + 1).title}`, h('span', { html: ICONS.arrowR, style: 'display:contents' }))
      : h('a', { class: 'btn btn-primary', href: '#prirucka' }, 'Příručka a co dál', h('span', { html: ICONS.arrowR, style: 'display:contents' }));
  } else {
    next = h('button', {
      class: 'btn btn-primary', type: 'button',
      onclick: () => { markStep(n, step.key); location.hash = `#l${n}-${STEPS[idx + 1].slug}`; },
    }, isStepDone(n, step.key) ? `Dál: ${STEPS[idx + 1].label}` : `Hotovo, dál: ${STEPS[idx + 1].label}`, h('span', { html: ICONS.arrowR, style: 'display:contents' }));
  }

  return h('div', null, head, nav, h('section', { 'aria-label': step.label }, body), h('div', { class: 'step-foot' }, prev, next));
}

const stepTitle = (title, ...extra) => h('div', { class: 'step-title' }, h('h2', null, title), extra);

// ---------- Dialog ----------
function renderDialog(lesson) {
  const d = lesson.steps.dialog;
  const roles = d.roles;
  const state = { role: null, playing: 0, explainAll: false };
  const wrap = h('div', { class: 'stack' });
  const list = h('div', { class: 'dialog' });
  const pitch = (who) => [1, 0.82, 1.18][Math.max(0, roles.indexOf(who))] || 1;

  const lineEls = [];
  const draw = () => {
    list.replaceChildren();
    lineEls.length = 0;
    d.lines.forEach((ln, i) => {
      if (ln.stage) { list.append(h('p', { class: 'stage', html: ln.stage })); lineEls.push(null); return; }
      const mine = state.role === ln.who;
      const el = h('div', { class: `line${mine ? ' mine' : ''}`, 'data-i': i },
        h('div', { class: 'who', 'data-r': roles.indexOf(ln.who) }, ln.who));
      const text = h('div', { style: 'min-width:0' },
        h('div', { class: 'zh' }, ln.zh),
        pyEl(ln.py, 'line-py'),
        h('div', { class: 'cz line-cz', html: ln.cz }),
        ln.ex ? explainToggle(ln.ex, state.explainAll) : null);
      if (mine) {
        const reveal = h('button', { class: 'btn btn-small', type: 'button' }, 'Řekl(a) jsem to, ukaž správně');
        const prompt = h('div', { class: 'mine-prompt' }, h('span', { class: 'eyebrow' }, 'Tvoje replika'), h('div', { class: 'cz', html: ln.cz }), reveal);
        reveal.addEventListener('click', () => {
          prompt.replaceWith(text);
          el.dataset.revealed = '1';
          Speech.speak(ln.zh, { pitch: pitch(ln.who) }).then(() => el.dispatchEvent(new Event('revealed')));
        });
        el.append(prompt, sayBtn(ln.zh, { pitch: pitch(ln.who) }));
      } else {
        el.append(text, sayBtn(ln.zh, { pitch: pitch(ln.who) }));
      }
      list.append(el);
      lineEls.push(el);
    });
  };

  const highlight = (i) => {
    lineEls.forEach((el, k) => el && el.classList.toggle('current', k === i));
    if (i >= 0 && lineEls[i]) lineEls[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  const stop = () => {
    state.playing++;
    Speech.stop();
    highlight(-1);
    playBtn.dataset.on = '';
    playBtn.textContent = state.role ? 'Spustit scénku' : 'Přehrát celý dialog';
  };
  onLeave(stop);

  const playAll = async () => {
    if (playBtn.dataset.on === '1') { stop(); return; }
    const token = ++state.playing;
    playBtn.dataset.on = '1';
    playBtn.textContent = 'Zastavit';
    for (let i = 0; i < d.lines.length; i++) {
      const ln = d.lines[i];
      if (ln.stage) continue;
      if (token !== state.playing) return;
      highlight(i);
      const el = lineEls[i];
      if (state.role === ln.who && el && el.dataset.revealed !== '1') {
        const btn = el.querySelector('.mine-prompt .btn');
        if (btn) btn.focus({ preventScroll: true });
        await new Promise((res) => el.addEventListener('revealed', res, { once: true }));
      } else {
        await Speech.speak(ln.zh, { pitch: pitch(ln.who) });
        await new Promise((res) => setTimeout(res, 350));
      }
    }
    if (token === state.playing) stop();
  };

  const playBtn = h('button', { class: 'btn btn-ink', type: 'button', onclick: playAll }, 'Přehrát celý dialog');
  const pyToggle = h('label', { class: 'toggle', for: 'dlg-py' }, h('input', { type: 'checkbox', id: 'dlg-py', checked: true, onchange: (e) => wrap.classList.toggle('hide-py', !e.target.checked) }), 'Pinyin');
  const czToggle = h('label', { class: 'toggle', for: 'dlg-cz' }, h('input', { type: 'checkbox', id: 'dlg-cz', checked: true, onchange: (e) => wrap.classList.toggle('hide-cz', !e.target.checked) }), 'Překlad');
  const explainAllToggle = h('label', { class: 'toggle', for: 'dlg-explain' }, h('input', {
    type: 'checkbox', id: 'dlg-explain',
    onchange: (e) => {
      state.explainAll = e.target.checked;
      $$('.explain-btn', list).forEach((b) => { if ((b.getAttribute('aria-expanded') === 'true') !== state.explainAll) b.click(); });
    },
  }), 'Rozbor u všech vět');
  const roleSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Hraj roli' },
    [null, ...roles].map((r) => h('button', {
      type: 'button',
      'aria-pressed': String(state.role === r),
      onclick: (e) => {
        state.role = r;
        stop();
        $$('button', roleSeg).forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
        playBtn.textContent = r ? 'Spustit scénku' : 'Přehrát celý dialog';
        draw();
      },
    }, r ? `Hraju: ${r}` : 'Jen poslouchám')));

  draw();
  appendAll(wrap,
    stepTitle(`Dialog: ${d.title}`),
    d.intro.length ? renderBlocks(d.intro) : null,
    h('div', { class: 'toolbar' }, playBtn, pyToggle, czToggle, explainAllToggle),
    h('div', { class: 'toolbar' }, h('span', { class: 'muted', style: 'font-size:var(--fs-s)' }, 'Scénka:'), roleSeg),
    list,
    d.notes.length ? renderBlocks(d.notes) : null,
    h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, 'Čti dialog nahlas, dokud ho nezvládneš zpaměti. Ve scénce si vyber roli: aplikace řekne repliky druhých a ty odpovídáš. Pod každou větou je rozbor: z jakých slov se skládá a jak je myšlená.'));
  return wrap;
}

// Tlačítko „Rozbor věty“ s rozbalovacím panelem.
function explainToggle(ex, open) {
  const panel = explainPanel(ex);
  panel.hidden = !open;
  const btn = h('button', { class: 'explain-btn', type: 'button', 'aria-expanded': String(!!open) }, 'Rozbor věty');
  btn.addEventListener('click', () => {
    const on = btn.getAttribute('aria-expanded') !== 'true';
    btn.setAttribute('aria-expanded', String(on));
    panel.hidden = !on;
  });
  return h('div', null, btn, panel);
}

function explainPanel(ex) {
  const words = ex.words.map((w) => {
    const sayable = hasHan(w.zh);
    return h(sayable ? 'button' : 'span', {
      class: `word${w.isNew ? ' is-new' : ''}`,

    h('div', { class: 'words', role: 'list', 'aria-label': 'Slova ve větě' }, words),

// Řádek slovíčka. open: klepnutí otevře detail slova; vpravo přehrání a „Umím“.
function vocabRow(v, opts = {}) {
  const cz = h('span', { class: 'cz', html: v.czHtml || escapeHtml(v.cz) });
  cz.addEventListener('click', (e) => {
    if (cz.closest('.hide-meaning')) { e.stopPropagation(); cz.classList.toggle('peek'); }
  });
  const row = h('div', { class: `vrow${opts.open ? ' vrow-open' : ''}` },
    h('span', { class: 'zh' }, v.zh),
    pyEl(v.py),
    h('span', null, cz, opts.tag ? h('a', { class: 'tag', href: `#l${v.l}-slovicka`, style: 'margin-left:8px' }, `L${v.l}`) : null),
    h('span', { class: 'vrow-actions' },
      sayBtn(v.zh),
      v.l ? knownBtn('w', cardKey(v), { word: v, label: v.zh, compact: true, onChange: opts.onKnownChange }) : null));
  if (opts.open) {
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-label', `${v.zh} ${v.py}: ${v.cz}. Otevřít detail slova`);
    const open = () => WordSheet.open(v);
    row.addEventListener('click', (e) => { if (!e.target.closest('button, a')) open(); });
    row.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); open(); } });
  }
  return row;
}

// Rychlý test: znak → význam, čtyři možnosti.
function QuickQuiz(words, n) {
  const box = h('section', { class: 'sheet stack' });
  const start = () => {
    const pool = shuffle(words).slice(0, Math.min(8, words.length));
    let i = 0;
    let score = 0;
    const ask = () => {
      if (i >= pool.length) {
        box.replaceChildren(
          h('h2', null, 'Rychlý test slovíček'),
          h('p', null, `Výsledek: ${score} z ${pool.length}. ${score === pool.length ? 'Výborně!' : 'Co nevíš, procvič v kartičkách.'}`),
          h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: start }, 'Znovu'), h('a', { class: 'btn', href: `#karticky-l${n}` }, 'Kartičky lekce')));
        return;
      }
      const w = pool[i];
      const others = shuffle(COURSE.vocab.filter((v) => v.cz !== w.cz && (v.l === n || words.length < 6))).slice(0, 3);
      const opts = shuffle([w, ...others]);
      let answered = false;
      const optionEls = opts.map((o) => h('button', {
        class: 'tile', type: 'button', style: 'font-size:var(--fs-s);font-weight:600;flex:1 1 40%',
        onclick: (e) => {
          if (answered) return;
          answered = true;
          const ok = o === w;
          if (ok) score++;
          e.currentTarget.classList.add(ok ? 'right' : 'wrong');
          optionEls[opts.indexOf(w)].classList.add('right');
          Speech.speak(w.zh);
          setTimeout(() => { i++; ask(); }, ok ? 900 : 1700);
        },
      }, o.cz));
      box.replaceChildren(
        h('div', { class: 'row', style: 'justify-content:space-between' }, h('h2', null, 'Rychlý test slovíček'), h('span', { class: 'score' }, `${i + 1} / ${pool.length}`)),
        h('div', { class: 'quiz-card', style: 'border:0;padding:8px' },
          tzgRow(w.zh.replace(/[^\p{Script=Han}]/gu, '').slice(0, 4), 72),
          h('div', { class: 'row' }, pyEl(w.py), sayBtn(w.zh, { small: true })),
          h('div', { class: 'options quiz-options' }, optionEls)));
    };
    ask();
  };
  box.append(
    h('h2', null, 'Rychlý test slovíček'),
    h('p', { class: 'muted' }, 'Osm otázek: uvidíš znak a vybereš, co znamená.'),
    h('div', null, h('button', { class: 'btn', type: 'button', onclick: start }, 'Spustit test')));
  return box;
}

// src/js/exercises.js
// Cvičení lekce s okamžitou kontrolou podle klíče.

const parseAnswer = (s) => {
  const [zh, py = ''] = s.split('|').map((x) => x.trim());
  return { zh, py };
};
const normZh = (s) => onlyHan(s);

function exerciseIds(lesson) {
  const ids = [];
  for (const set of lesson.exercises || []) {
    if (set.items && (set.type === 'build' || set.type === 'choice')) set.items.forEach((_, i) => ids.push(`l${lesson.n}:${set.id}:${i}`));
    else ids.push(`l${lesson.n}:${set.id}`);
  }
  return ids;
}

function recordResult(lesson, id, ok) {
  const prev = progress.ex[id];
  if (prev && prev.ok && !ok) return;
  progress.ex[id] = { ok, t: Date.now(), tries: ((prev && prev.tries) || 0) + 1 };
  const ids = exerciseIds(lesson);
  const all = ids.every((x) => progress.ex[x] && progress.ex[x].ok);
  if (all && !isStepDone(lesson.n, 'ex')) {
    progress.steps[stepId(lesson.n, 'ex')] = true;
    toast(`Cvičení lekce ${lesson.n} máš celé správně.`);
    const navItem = $$('.steps a')[STEPS.length - 1];
    if (navItem) navItem.classList.add('done');
  }
  commit();
}

function feedbackEl(ok, title, answer, note) {
  return h('div', { class: `feedback ${ok ? 'ok' : 'bad'}`, role: 'status' },
    h('span', { class: 'mark', 'aria-hidden': 'true' }, ok ? '✓' : '✗'),
    h('span', { class: 'title' }, title),
    answer ? h('div', { class: 'answer' }, h('span', { class: 'zh' }, answer.zh), answer.py ? pyEl(answer.py) : null, sayBtn(answer.zh, { small: true })) : null,
    note ? makeSayable(h('p', { class: 'note' }, note)) : null);
}

function renderExercises(lesson) {
  const wrap = h('div', { class: 'stack-l' });
  const key = COURSE.appendix.key[lesson.n];
  const ex = lesson.steps.ex;
  if (!lesson.exercises) {
    wrap.append(stepTitle(ex.title), renderBlocks(ex.blocks));
  } else {
    wrap.append(h('div', { class: 'stack' },
      stepTitle(ex.title),
      h('p', { class: 'muted' }, 'Skládej věty z kartiček, klepnutím kartičku vrátíš. Kontrola proběhne podle klíče z učebnice, a když je správných řešení víc, uzná všechna.')));
    for (const set of lesson.exercises) wrap.append(ExerciseSet(lesson, set));
  }
  if (key) {
    wrap.append(h('details', { class: 'key' },
      h('summary', null, 'Klíč z učebnice (pro kontrolu na papíře)'),
      makeSayable(h('div', { html: key }))));
  }
  return wrap;
}

function ExerciseSet(lesson, set) {
  const n = lesson.n;
  const score = h('span', { class: 'score' });
  const ids = set.items && (set.type === 'build' || set.type === 'choice')
    ? set.items.map((_, i) => `l${n}:${set.id}:${i}`)
    : [`l${n}:${set.id}`];
  const updateScore = () => {
    const ok = ids.filter((id) => progress.ex[id] && progress.ex[id].ok).length;
    score.textContent = `${ok} / ${ids.length}`;
    score.classList.toggle('full', ok === ids.length);
  };
  const onResult = (id, ok) => { recordResult(lesson, id, ok); updateScore(); };
  updateScore();

  let body;
  if (set.type === 'build') body = set.items.map((it, i) => BuildItem(set, it, ids[i], onResult));
  else if (set.type === 'choice') body = set.items.map((it, i) => ChoiceItem(set, it, ids[i], onResult));
  else if (set.type === 'pick') body = PickItem(set, ids[0], onResult);
  else if (set.type === 'sort') body = SortItem(set, ids[0], onResult);
  else if (set.type === 'write') body = WriteItem(set, ids[0], onResult);

  return h('section', { class: 'exset' },
    h('div', { class: 'exset-head' },
      makeSayable(h('h3', null, h('span', { class: 'id' }, `${set.id}.`), set.title)),
      set.type === 'write' ? null : score),
    body);
}

// ---------- Skládání věty ----------
function BuildItem(set, item, id, onResult) {
  const reuse = !!set.keypad;
  const tiles = reuse ? set.keypad : shuffle([...item.tiles, ...(item.extra || [])], hashStr(id));
  const answers = item.answers.map(parseAnswer);
  let chosen = [];
  let locked = false;
  let solvedText = '';

  const label = set.fix ? 'Oprav' : reuse ? 'Napiš' : hasHan(item.prompt) ? (item.prompt.includes(' / ') ? 'Seřaď' : 'Výchozí věta') : 'Přelož';
  const promptText = hasHan(item.prompt) && !item.prompt.includes(' / ')
    ? h('span', { class: `text zh hz-say${set.fix ? ' wrong' : ''}`, 'data-say': item.prompt }, item.prompt)
    : h('span', { class: `text${hasHan(item.prompt) ? ' zh' : ''}` }, item.prompt);
  const el = h('div', { class: 'item' });
  const slot = h('div', { class: 'slot', 'aria-label': 'Tvoje odpověď', role: 'group' });
  const bank = h('div', { class: 'bank', role: 'group', 'aria-label': 'Kartičky' });
  const fb = h('div', { 'aria-live': 'polite' });
  const checkBtn = h('button', { class: 'btn btn-primary', type: 'button' }, 'Zkontrolovat');
  const clearBtn = h('button', { class: 'btn', type: 'button' }, 'Smazat');
  const actions = h('div', { class: 'row' }, checkBtn, clearBtn);

  const tileBtn = (t, onclick, disabled) => h('button', { class: 'tile', type: 'button', disabled, onclick },
    h('span', { class: 'zh' }, t),
    COURSE.pinyin[t] ? h('span', { class: 'py' }, COURSE.pinyin[t]) : null);

  const draw = () => {
    slot.replaceChildren(...(chosen.length
      ? chosen.map((ti, k) => tileBtn(tiles[ti], () => { if (locked) return; chosen.splice(k, 1); fb.replaceChildren(); draw(); }))
      : locked && solvedText
        ? [h('span', { class: 'zh', style: 'font-size:1.375rem;padding:0 4px 4px' }, solvedText)]
        : [h('span', { class: 'placeholder' }, 'Klepej na kartičky dole a skládej odpověď.')]));
    bank.replaceChildren(...tiles.map((t, ti) => tileBtn(t, () => {
      if (locked) return;
      chosen.push(ti);
      fb.replaceChildren();
      draw();
    }, locked || (!reuse && chosen.includes(ti)))));
    bank.hidden = locked;
    checkBtn.disabled = locked;
    clearBtn.disabled = locked || !chosen.length;
  };

  const showSolved = (answer) => {
    locked = true;
    solvedText = answer.zh;
    el.classList.add('is-ok');
    const again = h('button', { class: 'btn btn-small', type: 'button', onclick: () => { locked = false; chosen = []; el.classList.remove('is-ok'); fb.replaceChildren(); actions.hidden = false; draw(); } }, 'Zkusit znovu');
    fb.replaceChildren(feedbackEl(true, 'Správně!', answer, item.note), h('div', { class: 'row', style: 'margin-top:8px' }, again));
    actions.hidden = true;
    draw();
  };

  checkBtn.addEventListener('click', () => {
    if (!chosen.length) { slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake'); return; }
    const built = chosen.map((ti) => tiles[ti]).join('');
    const match = answers.find((a) => normZh(a.zh) === normZh(built));
    if (match) {
      onResult(id, true);
      Speech.speak(match.zh);
      showSolved(match);
    } else {
      onResult(id, false);
      const reveal = h('button', { class: 'btn btn-small', type: 'button', onclick: () => {
        fb.replaceChildren(feedbackEl(false, 'Řešení:', answers[0], item.note), h('p', { class: 'muted', style: 'font-size:var(--fs-s);margin-top:6px' }, 'Slož ho teď sám, ať si ho zapamatuješ.'));
      } }, 'Ukázat řešení');
      fb.replaceChildren(feedbackEl(false, 'Ještě ne. Zkus to znovu.', null, null), h('div', { class: 'row', style: 'margin-top:8px' }, reveal));
    }
  });
  clearBtn.addEventListener('click', () => { chosen = []; fb.replaceChildren(); draw(); });

  el.append(h('div', { class: 'prompt' }, h('span', { class: 'label' }, label), promptText), slot, bank, actions, fb);
  draw();
  const saved = progress.ex[id];
  if (saved && saved.ok) showSolved(answers[0]);
  return el;
}

// ---------- Doplňování ----------
function ChoiceItem(set, item, id, onResult) {
  const options = item.options || set.options;
  const full = parseAnswer(item.full);
  const [before, after] = item.prompt.split('___');
  const blank = h('span', { class: 'blank' }, '?');
  const fb = h('div', { 'aria-live': 'polite' });
  const el = h('div', { class: 'item' });
  let done = false;
  const optEls = options.map((o) => h('button', {
    class: 'tile', type: 'button', 'data-opt': o,
    onclick: (e) => {
      if (done) return;
      const ok = o === item.answer;
      onResult(id, ok);
      if (ok) {
        solve();
        Speech.speak(full.zh);
      } else {
        e.currentTarget.classList.add('wrong');
        fb.replaceChildren(feedbackEl(false, `${o} sem nepatří. Zkus to znovu.`, null, item.note));
      }
    },
  }, h('span', { class: 'zh' }, o), COURSE.pinyin[o] ? h('span', { class: 'py' }, COURSE.pinyin[o]) : null));
  const solve = () => {
    done = true;
    blank.textContent = item.answer;
    blank.classList.add('filled');
    el.classList.add('is-ok');
    optEls.forEach((b) => {
      const right = b.dataset.opt === item.answer;
      b.disabled = !right;
      b.classList.toggle('right', right);
      b.classList.remove('wrong');
    });
    fb.replaceChildren(feedbackEl(true, 'Správně!', full, item.note));
  };
  el.append(
    h('div', { class: 'prompt' }, h('span', { class: 'text zh' }, before, blank, after || '')),
    h('div', { class: 'options' }, optEls),
    fb);
  if (progress.ex[id] && progress.ex[id].ok) solve();
  return el;
}

// ---------- Výběr znaků s radikálem ----------
function PickItem(set, id, onResult) {
  const selected = new Set();
  const fb = h('div', { 'aria-live': 'polite' });
  const el = h('div', { class: 'item' });
  const cells = set.chars.map((c) => h('button', {
    class: 'tzg', type: 'button', 'aria-pressed': 'false', 'aria-label': c,
    onclick: (e) => {
      if (el.classList.contains('is-ok')) return;
      const b = e.currentTarget;
      if (selected.has(c)) selected.delete(c); else selected.add(c);
      b.setAttribute('aria-pressed', String(selected.has(c)));
      cells.forEach((x) => x.classList.remove('right', 'wrong'));
      fb.replaceChildren();
    },
  }, c));
  const check = h('button', { class: 'btn btn-primary', type: 'button' }, 'Zkontrolovat');
  const showResult = (final) => {
    let ok = true;
    cells.forEach((b, i) => {
      const c = set.chars[i];
      const should = set.answer.includes(c);
      const has = selected.has(c);
      b.classList.toggle('right', has && should);
      b.classList.toggle('wrong', has !== should);
      if (has !== should) ok = false;
    });
    if (ok) {
      el.classList.add('is-ok');
      check.hidden = true;
      fb.replaceChildren(feedbackEl(true, `Správně: ${set.answer.join(', ')}.`, null, set.note));
    } else if (!final) {
      fb.replaceChildren(feedbackEl(false, 'Ještě ne. Červeně jsou znaky, které jsou označené špatně nebo chybí.', null, null));
    }
    return ok;
  };
  check.addEventListener('click', () => onResult(id, showResult(false)));
  el.append(h('div', { class: 'pick-grid', role: 'group', 'aria-label': 'Znaky' }, cells), h('div', { class: 'row' }, check), fb);
  if (progress.ex[id] && progress.ex[id].ok) {
    set.answer.forEach((c) => selected.add(c));
    cells.forEach((b, i) => b.setAttribute('aria-pressed', String(selected.has(set.chars[i]))));
    showResult(true);
  }
  return el;
}

// ---------- Třídění podle radikálu ----------
function SortItem(set, id, onResult) {
  const chosen = {};
  const fb = h('div', { 'aria-live': 'polite' });
  const el = h('div', { class: 'item' });
  const check = h('button', { class: 'btn btn-primary', type: 'button', disabled: true }, 'Zkontrolovat');
  const cards = set.items.map((it) => {
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': `Radikál znaku ${it.zh}` }, set.groups.map((g) =>
      h('button', {
        type: 'button', 'aria-pressed': 'false', title: g.label,
        onclick: (e) => {
          if (el.classList.contains('is-ok')) return;
          chosen[it.zh] = g.key;
          $$('button', seg).forEach((b) => b.setAttribute('aria-pressed', String(b === e.currentTarget)));
          cards.forEach((c) => c.classList.remove('right', 'wrong'));
          check.disabled = Object.keys(chosen).length < set.items.length;
          fb.replaceChildren();
        },
      }, g.key)));
    return h('div', { class: 'sort-card' }, h('span', { class: 'tzg' }, it.zh), seg);
  });
  const showResult = () => {
    let ok = true;
    set.items.forEach((it, i) => {
      const good = chosen[it.zh] === it.group;
      cards[i].classList.toggle('right', good);
      cards[i].classList.toggle('wrong', !good);
      if (!good) ok = false;
    });
    if (ok) {
      el.classList.add('is-ok');
      check.hidden = true;
      fb.replaceChildren(feedbackEl(true, 'Správně roztříděno.', null,
        set.groups.map((g) => `${g.key} ${g.label}: ${set.items.filter((it) => it.group === g.key).map((it) => it.zh).join(', ')}`).join(' · ')));
    } else {
      fb.replaceChildren(feedbackEl(false, 'Některé znaky jsou ve špatné skupině (červeně).', null, null));
    }
    return ok;
  };
  check.addEventListener('click', () => onResult(id, showResult()));
  el.append(
    h('div', { class: 'legend' }, set.groups.map((g) => h('span', { style: '--c:var(--grid)' }, `${g.key} = ${g.label}`))),
    h('div', { class: 'sort-grid' }, cards), h('div', { class: 'row' }, check), fb);
  if (progress.ex[id] && progress.ex[id].ok) {
    set.items.forEach((it, i) => {
      chosen[it.zh] = it.group;
      $$('button', cards[i]).forEach((b) => b.setAttribute('aria-pressed', String(b.textContent === it.group)));
    });
    showResult();
  }
  return el;
}

// ---------- Volné psaní ----------
function WriteItem(set, id, onResult) {
  const saved = progress.notes[id];
  const area = h('textarea', { id: `write-${id.replace(/:/g, '-')}`, 'aria-label': set.title, placeholder: '我叫……。我是……人。' });
  area.value = saved ? saved.text : '';
  const status = h('span', { class: 'muted', 'aria-live': 'polite', style: 'font-size:var(--fs-s)' }, saved ? 'Uloženo.' : '');
  const save = h('button', { class: 'btn btn-primary', type: 'button', onclick: () => {
    const text = area.value.trim();
    progress.notes[id] = { text, t: Date.now() };
    onResult(id, !!text);
    status.textContent = text ? 'Uloženo. Přečti si to nahlas.' : 'Prázdný text jsem neuložil.';
  } }, 'Uložit');
  const read = h('button', { class: 'btn', type: 'button', onclick: () => Speech.speak(area.value) }, 'Přečíst nahlas');
  return h('div', { class: 'item' },
    makeSayable(h('ul', { class: 'hints' }, set.hints.map((t) => h('li', null, t)))),
    h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, 'Piš čínskými znaky (s čínskou klávesnicí v telefonu nebo počítači), nebo pinyinem.'),
    area,
    h('div', { class: 'row' }, save, read, status),
    set.note ? h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, set.note) : null);
}

// src/js/cards.js
// Kartičky se slovíčky a opakováním s rozestupy (Leitnerovy krabičky).

const INTERVALS = [0, 1, 3, 7, 14, 30];
const MODES = [
  { key: 'zh', label: 'Znak → význam' },
  { key: 'cz', label: 'Význam → znak' },
  { key: 'audio', label: 'Poslech → význam' },
];

function CardsView(preset) {
  const wrap = h('div', { class: 'narrow stack-l' });
  const cfg = loadJSON('cinstina-krok-za-krokem/karticky', { lessons: [1], mode: 'zh' });
  if (preset) cfg.lessons = [preset];
  if (!cfg.lessons.length) cfg.lessons = [1];
  const saveCfg = () => saveJSON('cinstina-krok-za-krokem/karticky', cfg);

  const pool = () => COURSE.vocab.filter((v) => cfg.lessons.includes(v.l));
  const counts = (words) => {
    const now = today();
    const c = { fresh: 0, learning: 0, known: 0, due: 0 };
    for (const v of words) {
      const card = progress.cards[cardKey(v)];
      if (!card) c.fresh++;
      else {
        if (card.box >= 3) c.known++; else c.learning++;
        if (card.due <= now) c.due++;
      }
    }
    return c;
  };

  const setup = () => {
    const words = pool();
    const c = counts(words);
    const newToday = Math.min(10, c.fresh);
    const total = Math.min(20, c.due + newToday);
    const lessonChips = h('div', { class: 'row', role: 'group', 'aria-label': 'Lekce' }, LESSONS.map((l) =>
      h('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(cfg.lessons.includes(l.n)), title: l.title,
        onclick: () => {
          const i = cfg.lessons.indexOf(l.n);
          if (i >= 0) { if (cfg.lessons.length > 1) cfg.lessons.splice(i, 1); } else cfg.lessons.push(l.n);
          cfg.lessons.sort((a, b) => a - b);
          saveCfg();
          setup();
        },
      }, `L${l.n}`)));
    const modeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Směr' }, MODES.map((m) =>
      h('button', { type: 'button', 'aria-pressed': String(cfg.mode === m.key), onclick: () => { cfg.mode = m.key; saveCfg(); setup(); } }, m.label)));
    const all = words.length || 1;
    const dist = h('div', { class: 'stack', style: 'gap:8px' },
      h('div', { class: 'boxes', role: 'img', 'aria-label': `Nová ${c.fresh}, učíš se ${c.learning}, umíš ${c.known}` },
        h('i', { style: `width:${(c.known / all) * 100}%;background:var(--grid)` }),
        h('i', { style: `width:${(c.learning / all) * 100}%;background:var(--t2)` }),
        h('i', { style: `width:${(c.fresh / all) * 100}%;background:transparent` })),
      h('div', { class: 'legend' },
        h('span', { style: '--c:var(--grid)' }, `umíš ${c.known}`),
        h('span', { style: '--c:var(--t2)' }, `učíš se ${c.learning}`),
        h('span', { style: '--c:var(--rule)' }, `nová ${c.fresh}`)));
    const startBtn = total
      ? h('button', { class: 'btn btn-primary', type: 'button', onclick: () => session(false) }, `Začít: ${plural(total, 'kartička', 'kartičky', 'kartiček')}`)
      : h('button', { class: 'btn btn-primary', type: 'button', onclick: () => session(true) }, 'Procvičit i tak');
    wrap.replaceChildren(
      h('header', { class: 'page-head' },
        h('span', { class: 'eyebrow' }, 'Opakování s rozestupy'),
        h('h1', null, 'Kartičky'),
        h('p', { class: 'lead' }, 'Co umíš, uvidíš znovu za pár dní. Co nevíš, vrátí se ještě dnes. Stačí pár minut denně.')),
      h('section', { class: 'sheet stack' },
        h('div', { class: 'field' }, h('span', { class: 'label', style: 'font-weight:700;font-size:var(--fs-s)' }, 'Slovíčka z lekcí'), lessonChips),
        h('div', { class: 'field' }, h('span', { class: 'label', style: 'font-weight:700;font-size:var(--fs-s)' }, 'Směr'), modeSeg),
        dist,
        h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, total
          ? [c.due ? `K opakování: ${plural(c.due, 'slovíčko', 'slovíčka', 'slovíček')}.` : '', newToday ? `Nová slovíčka: ${newToday}.` : ''].filter(Boolean).join(' ')
          : 'Pro dnešek máš z vybraných lekcí hotovo. Můžeš přidat další lekci, nebo si je projet znovu.'),
        h('div', null, startBtn)));
  };

  const session = (cram) => {
    const words = pool();
    const now = today();
    let queue;
    if (cram) queue = shuffle(words).slice(0, 15);
    else {
      const due = shuffle(words.filter((v) => progress.cards[cardKey(v)] && progress.cards[cardKey(v)].due <= now));
      const fresh = words.filter((v) => !progress.cards[cardKey(v)]).slice(0, 10);
      queue = [...due, ...fresh].slice(0, 20);
    }
    const total = queue.length;
    const stats = { good: 0, hard: 0, again: 0 };
    let current = null;
    let flipped = false;
    let doneCount = 0;
    const repeated = new Set();

    const rate = (grade) => {
      const key = cardKey(current);
      const card = progress.cards[key] || { box: 0, due: now };
      if (!cram || grade === 'again') {
        if (grade === 'again') { card.box = 1; card.due = now; }
        else if (grade === 'hard') { card.box = Math.max(1, card.box); card.due = now + 1; }
        else { card.box = Math.min(5, card.box + 1); card.due = now + INTERVALS[card.box]; }
        card.t = Date.now();
        progress.cards[key] = card;
        commit();
      }
      stats[grade]++;
      if (grade === 'again' && !repeated.has(key)) { repeated.add(key); queue.push(current); }
      else doneCount++;
      next();
    };

    const next = () => {
      current = queue.shift();
      flipped = false;
      if (!current) return finish();
      draw();
      if (cfg.mode === 'audio') Speech.speak(current.zh);
    };

    const flip = () => {
      if (flipped) return;
      flipped = true;
      draw();
      if (cfg.mode !== 'audio') Speech.speak(current.zh);
    };

    const face = () => {
      const v = current;
      const hanzi = [...v.zh].filter((c) => /\p{Script=Han}/u.test(c));
      const big = hanzi.length <= 4 && !/[…/]/.test(v.zh) ? tzgRow(v.zh, hanzi.length > 2 ? 80 : 104) : h('span', { class: 'zh', style: 'font-size:2.5rem' }, v.zh);
      const corner = h('span', { class: 'corner' }, `Lekce ${v.l}`);
      const back = [
        h('div', { class: 'row', style: 'justify-content:center' }, pyEl(v.py), sayBtn(v.zh, { small: true }), knownBtn('w', cardKey(v), { word: v, label: v.zh, compact: true })),
        h('div', { class: 'cz' }, v.cz),
        h('div', { class: 'row', style: 'justify-content:center;gap:4px' }, [...new Set(onlyHan(v.zh))].filter((c) => CHARS[c]).map((c) =>
          h('a', { class: 'btn btn-small', href: charHash(c), onclick: (e) => e.stopPropagation() }, h('span', { class: 'zh' }, c), ' jak vznikl')))];
      if (cfg.mode === 'zh') return [corner, big, ...(flipped ? back : [h('p', { class: 'hint' }, 'Co to znamená? Klepni pro otočení.')])];
      if (cfg.mode === 'cz') {
        return [corner, h('div', { class: 'big-cz' }, v.cz),
          ...(flipped ? [big, back[0]] : [h('p', { class: 'hint' }, 'Jak se to řekne čínsky? Řekni to nahlas a otoč.')])];
      }
      return [corner,
        flipped ? big : h('button', { class: 'say', type: 'button', style: 'width:84px;height:84px', 'aria-label': 'Přehrát znovu', html: ICONS.play.replace('<svg', '<svg style="width:34px;height:34px"'), onclick: (e) => { e.stopPropagation(); Speech.speak(v.zh); } }),
        ...(flipped ? back : [h('p', { class: 'hint' }, 'Co slyšíš? Klepni pro otočení.')])];
    };

    const draw = () => {
      const card = h('div', { class: 'flash', role: 'button', tabindex: '0', 'aria-label': flipped ? 'Kartička' : 'Otočit kartičku', onclick: flip }, face());
      const rateRow = flipped
        ? h('div', { class: 'rate' },
          h('button', { class: 'btn again', type: 'button', onclick: () => rate('again') }, 'Nevím', h('small', null, 'ještě dnes')),
          h('button', { class: 'btn', type: 'button', onclick: () => rate('hard') }, 'Skoro', h('small', null, 'zítra')),
          h('button', { class: 'btn good', type: 'button', onclick: () => rate('good') }, 'Umím',
            h('small', null, cram ? 'dál' : `za ${plural(INTERVALS[Math.min(5, ((progress.cards[cardKey(current)] || {}).box || 0) + 1)], 'den', 'dny', 'dní')}`)))
        : h('button', { class: 'btn btn-ink', type: 'button', onclick: flip }, 'Otočit');
      wrap.replaceChildren(h('div', { class: 'flash-wrap' },
        h('div', { class: 'progress-line' },
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => quit() }, 'Ukončit'),
          h('div', { class: 'bar' }, h('i', { style: `width:${(doneCount / total) * 100}%` })),
          h('span', null, `${doneCount} / ${total}`)),
        card, rateRow,
        h('p', { class: 'kbd' }, h('kbd', null, 'mezerník'), ' otočí, ', h('kbd', null, '1'), ' ', h('kbd', null, '2'), ' ', h('kbd', null, '3'), ' ohodnotí')));
      if (flipped) {
        const first = $('.rate .good', wrap);
        if (first) first.focus({ preventScroll: true });
      } else card.focus({ preventScroll: true });
    };

    const quit = () => {
      current = null;
      document.removeEventListener('keydown', onKey);
      setup();
    };

    const finish = () => {
      current = null;
      wrap.replaceChildren(h('div', { class: 'flash-wrap' },
        h('div', { class: 'flash', style: 'cursor:default' },
          tzgRow('完成', 72),
          h('div', { class: 'big-cz' }, 'Hotovo!'),
          pyEl('wánchéng'),
          h('p', { class: 'hint' }, `Umím ${stats.good} · skoro ${stats.hard} · nevím ${stats.again}`)),
        h('div', { class: 'row', style: 'justify-content:center' },
          h('button', { class: 'btn btn-primary', type: 'button', onclick: () => quit() }, 'Zpět na přehled'),
          h('a', { class: 'btn', href: '#domu' }, 'Na lekce'))));
    };

    const onKey = (e) => {
      if (!current || e.target.closest('input, textarea, select, dialog')) return;
      if ((e.key === ' ' || e.key === 'Enter') && !flipped) { e.preventDefault(); flip(); }
      else if (flipped && ['1', '2', '3'].includes(e.key)) rate(['again', 'hard', 'good'][Number(e.key) - 1]);
    };
    document.addEventListener('keydown', onKey);
    onLeave(() => document.removeEventListener('keydown', onKey));
    next();
  };

  setup();
  return wrap;
}

// src/js/tones.js
// Trenažér tónů: poslechni (nebo přečti) slovo a vyber správný pinyin.

const TONE_NAMES = { 1: '1. tón', 2: '2. tón', 3: '3. tón', 4: '4. tón', 5: 'neutrální' };

// Pinyin rozložený na slova a slabiky, aby šel znovu složit se změněným tónem.
function pyStructure(py) {
  const tokens = py.normalize('NFC').split(/(\s+)/);
  const sylls = [];
  const words = tokens.map((tok, wi) => {
    if (!tok.trim()) return null;
    const parts = splitWord(tok);
    if (!parts) return undefined;
    parts.forEach((p, pi) => sylls.push({ wi, pi, tone: p.tone }));
    return parts.map((p) => p.text);
  });
  if (words.includes(undefined)) return null;
  return { tokens, words, sylls };
}
function pyWithTone(struct, idx, tone) {
  const s = struct.sylls[idx];
  return struct.tokens.map((tok, wi) => {
    if (!struct.words[wi]) return tok;
    return struct.words[wi].map((text, pi) => (wi === s.wi && pi === s.pi ? setTone(text, tone) : text)).join('');
  }).join('');
}
function toneVariants(py) {
  const st = pyStructure(py);
  if (!st) return [];
  const out = new Set();
  st.sylls.forEach((s, i) => {
    for (const t of [1, 2, 3, 4]) if (t !== s.tone) out.add(pyWithTone(st, i, t));
  });
  out.delete(py);
  return [...out];
}

function tonePool(lessons, listening) {
  return COURSE.vocab.filter((v) => {
    if (!lessons.includes(v.l) || /[…/]/.test(v.zh) || v.py.includes('/')) return false;
    const syl = syllables(v.py);
    if (!syl || syl.length < 1 || syl.length > 2) return false;
    if (onlyHan(v.zh).length !== syl.length) return false;
    if (listening) {
      // Tónové změny (3+3, 一, 不) by sluch zmátly.
      if (/[一不]/.test(v.zh)) return false;
      if (syl.length === 2 && syl[0].tone === 3 && syl[1].tone === 3) return false;
    }
    return toneVariants(v.py).length >= 3;
  });
}

function TonesView() {
  const wrap = h('div', { class: 'narrow stack-l' });
  const cfg = loadJSON('cinstina-krok-za-krokem/tony', { mode: 'listen', lessons: LESSONS.map((l) => l.n) });
  const saveCfg = () => saveJSON('cinstina-krok-za-krokem/tony', cfg);
  const game = h('section', { class: 'stack' });

  const legend = h('div', { class: 'tone-cards' }, [['妈', 'mā', 'máma'], ['麻', 'má', 'konopí'], ['马', 'mǎ', 'kůň'], ['骂', 'mà', 'nadávat'], ['吗', 'ma', 'otázka']].map(([zh, py, cz], i) => {
    const tone = i + 1;
    return h('div', { class: 'tone-card' },
      h('span', { class: 'eyebrow', style: 'color:var(--ink-soft)' }, TONE_NAMES[tone]),
      h('div', { class: 'row', style: 'justify-content:space-between' }, h('span', { class: `mark tc${tone}` }, py), h('span', { html: contourSvg(tone) })),
      h('div', { class: 'ex' }, h('span', { class: 'zh' }, zh), h('span', { class: 'muted' }, cz), sayBtn(zh, { small: true })));
  }));

  const controls = () => {
    const modeSeg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Režim' },
      [['listen', 'Poslouchej'], ['read', 'Čti znaky']].map(([k, label]) =>
        h('button', { type: 'button', 'aria-pressed': String(cfg.mode === k), onclick: () => { cfg.mode = k; saveCfg(); start(); } }, label)));
    const chips = h('div', { class: 'row', role: 'group', 'aria-label': 'Lekce' }, LESSONS.map((l) =>
      h('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(cfg.lessons.includes(l.n)),
        onclick: () => {
          const i = cfg.lessons.indexOf(l.n);
          if (i >= 0) { if (cfg.lessons.length > 1) cfg.lessons.splice(i, 1); } else cfg.lessons.push(l.n);
          saveCfg();
          start();
        },
      }, `L${l.n}`)));
    return h('div', { class: 'sheet stack' },
      h('div', { class: 'toolbar', style: 'margin:0' }, modeSeg),
      h('div', { class: 'field' }, h('span', { style: 'font-weight:700;font-size:var(--fs-s)' }, 'Slova z lekcí'), chips),
      cfg.mode === 'listen' && Speech.loaded && !Speech.hasVoice()
        ? h('p', { class: 'help muted', style: 'font-size:var(--fs-s)' }, 'V zařízení nevidím čínský hlas, poslech nemusí fungovat. Zkus režim „Čti znaky“.')
        : null);
  };

  const start = () => {
    const listening = cfg.mode === 'listen';
    const pool = shuffle(tonePool(cfg.lessons, listening));
    const rounds = pool.slice(0, 10);
    let i = 0;
    let score = 0;
    let streak = 0;
    const ask = () => {
      if (i >= rounds.length) {
        game.replaceChildren(controls(), h('div', { class: 'quiz-card' },
          h('span', { class: 'eyebrow' }, 'Výsledek'),
          h('h2', { style: 'font-size:var(--fs-2xl)' }, `${score} z ${rounds.length}`),
          h('p', { class: 'muted' }, score === rounds.length ? 'Bez chyby. Tvoje ucho už tóny slyší.' : 'Tóny chtějí čas. Zkus další kolo, každé má jiná slova.'),
          h('button', { class: 'btn btn-primary', type: 'button', onclick: start }, 'Další kolo')));
        return;
      }
      const v = rounds[i];
      const options = shuffle([v.py, ...shuffle(toneVariants(v.py)).slice(0, 3)]);
      let answered = false;
      const reveal = h('div', { class: 'stack', style: 'align-items:center;gap:8px' });
      const optEls = options.map((o) => h('button', {
        class: 'tile no-tones', type: 'button',
        onclick: (e) => {
          if (answered) return;
          answered = true;
          const ok = o === v.py;
          if (ok) { score++; streak++; } else streak = 0;
          e.currentTarget.classList.add(ok ? 'right' : 'wrong');
          optEls[options.indexOf(v.py)].classList.add('right');
          optEls.forEach((b) => b.classList.remove('no-tones'));
          const syl = syllables(v.py);
          reveal.replaceChildren(
            listening ? tzgRow(v.zh, 72) : null,
            h('div', { class: 'row', style: 'justify-content:center' }, pyEl(v.py), h('span', { class: 'muted' }, `· ${v.cz}`)),
            h('div', { class: 'row', style: 'justify-content:center' }, syl.map((s) => h('span', { title: TONE_NAMES[s.tone], html: contourSvg(s.tone) }))),
            h('button', { class: 'btn btn-primary', type: 'button', onclick: () => { i++; ask(); } }, i + 1 < rounds.length ? 'Další slovo' : 'Výsledek'));
          Speech.speak(v.zh);
          $('.btn-primary', reveal).focus({ preventScroll: true });
        },
      }, pyEl(o)));
      const cue = listening
        ? h('button', { class: 'say', type: 'button', style: 'width:88px;height:88px', 'aria-label': 'Přehrát slovo', html: ICONS.play.replace('<svg', '<svg style="width:36px;height:36px"'), onclick: () => Speech.speak(v.zh, { rate: 0.85 }) })
        : h('div', { class: 'stack', style: 'align-items:center;gap:6px' }, tzgRow(v.zh, 88), h('span', { class: 'muted' }, v.cz));
      game.replaceChildren(controls(), h('div', { class: 'quiz-card' },
        h('div', { class: 'progress-line', style: 'width:100%;max-width:420px' },
          h('div', { class: 'bar' }, h('i', { style: `width:${(i / rounds.length) * 100}%` })),
          h('span', null, `${i + 1} / ${rounds.length}`),
          streak >= 3 ? h('span', null, `série ${streak}`) : null),
        h('p', { class: 'muted' }, listening ? 'Poslechni si slovo a vyber pinyin se správnými tóny.' : 'Který pinyin má správné tóny?'),
        cue,
        h('div', { class: 'quiz-options' }, optEls),
        reveal));
      if (listening) setTimeout(() => Speech.speak(v.zh, { rate: 0.85 }), 250);
    };
    if (!rounds.length) {
      game.replaceChildren(controls(), h('p', { class: 'muted' }, 'Ve vybraných lekcích nejsou vhodná slova. Přidej další lekci.'));
      return;
    }
    if (listening) {
      // Poslech smí začít až po klepnutí (pravidlo prohlížečů pro zvuk).
      game.replaceChildren(controls(), h('div', { class: 'quiz-card' },
        h('p', null, `${plural(rounds.length, 'slovo', 'slova', 'slov')}. Uslyšíš slovo a vybereš správný pinyin.`),
        h('button', { class: 'btn btn-primary', type: 'button', onclick: ask }, 'Začít poslech')));
    } else ask();
  };

  wrap.append(
    h('header', { class: 'page-head' },
      h('span', { class: 'eyebrow' }, 'Trenažér'),
      h('h1', null, 'Tóny'),
      h('p', { class: 'lead' }, 'Čtyři melodie a jedna lehká. Nejdřív si je poslechni na slabice ma, pak trénuj na slovech z kurzu.')),
    legend,
    game);
  start();
  onLeave(() => Speech.stop());
  return wrap;
}

// src/js/characters.js
// Znaky: z čeho se skládají a jak vznikly. Detail znaku, detail slova a „Umím“.

const CHARS = COURSE.chars;
const CHAR_TYPES = {
  'obrázek': { label: 'Obrázek', desc: 'Vznikl z kresby toho, co znamená.' },
  'ukazatel': { label: 'Ukazatel', desc: 'Abstraktní značka: čárky, poloha, směr.' },
  'spojení': { label: 'Spojení významů', desc: 'Díly dohromady dávají nový význam.' },
  'zvuk': { label: 'Význam + zvuk', desc: 'Jeden díl napoví význam, druhý výslovnost. Takhle vzniká většina znaků.' },
  'výpůjčka': { label: 'Výpůjčka', desc: 'Původně znamenal něco jiného. Slovo si ho vypůjčilo, protože znělo podobně.' },
  'zjednodušený': { label: 'Zjednodušený', desc: 'Dnešní tvar vznikl zkrácením složitějšího tradičního znaku.' },
};
const ROLE_LABELS = { 'význam': 'význam', 'zvuk': 'zvuk', 'tvar': 'tvar' };

// Pořadí pro procházení: znaky podle lekce prvního výskytu, pak základní díly.
const CHAR_ORDER = (() => {
  const keys = Object.keys(CHARS);
  const pos = new Map();
  LESSONS.forEach((l) => l.newChars.forEach((c, i) => pos.set(c, l.n * 1000 + i)));
  const main = keys.filter((c) => !CHARS[c].dil).sort((a, b) =>
    (pos.get(a) ?? (CHARS[a].first || 9) * 1000 + 900 + keys.indexOf(a)) - (pos.get(b) ?? (CHARS[b].first || 9) * 1000 + 900 + keys.indexOf(b)));
  return [...main, ...keys.filter((c) => CHARS[c].dil)];
})();

// Ve kterých znacích se díl objevuje.
const USED_IN = (() => {
  const map = {};
  for (const c of CHAR_ORDER) {
    for (const d of CHARS[c].dily) {
      for (const part of new Set([d.c])) {
        (map[part] = map[part] || []);
        if (!map[part].includes(c)) map[part].push(c);
      }
    }
  }
  return map;
})();

const charHash = (c) => `#znak-${c.codePointAt(0).toString(16)}`;

// Čtverec se znakem: odkaz na detail, když ho máme, jinak jen znak.
function charCell(c, size) {
  const style = size ? `--s:${size}px` : null;
  if (CHARS[c]) return h('a', { class: 'tzg', href: charHash(c), style, 'aria-label': `Znak ${c}: ${CHARS[c].cz}` }, c);
  return h('span', { class: 'tzg', style }, c);
}

// Dlaždice znaku s pinyinem a významem (mřížky ve Slovníku a v lekci).
function charTile(c) {
  const z = CHARS[c];
  return h('a', { class: `char-tile${isKnownChar(c) ? ' is-known' : ''}`, href: charHash(c) },
    h('span', { class: 'tzg', 'aria-hidden': 'true' }, c),
    h('span', { class: 'meta' }, pyEl(z.py), h('span', { class: 'tcz' }, z.cz)),
    isKnownChar(c) ? h('span', { class: 'known-dot', title: 'Umím' }, '✓') : null);
}

const typeChip = (typ) => h('span', { class: `type-chip ty-${typ}` }, CHAR_TYPES[typ] ? CHAR_TYPES[typ].label : typ);

// Tlačítko „Umím“ pro slovo (kind 'w', key zh|py) nebo znak (kind 'c').
function knownBtn(kind, key, opts = {}) {
  const isOn = () => (kind === 'w' ? isKnownWord(opts.word) : isKnownChar(key));
  const btn = h('button', { class: `known-btn${opts.compact ? ' compact' : ''}`, type: 'button' });
  const paint = () => {
    const on = isOn();
    btn.setAttribute('aria-pressed', String(on));
    btn.title = on ? 'Umím (klepnutím odebereš)' : 'Přidat do Mého slovníku';
    btn.setAttribute('aria-label', on ? `Umím ${opts.label || key}, odebrat` : `Umím ${opts.label || key}`);
    btn.innerHTML = opts.compact ? (on ? '✓' : '+') : (on ? '✓ Umím' : 'Umím');
  };
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setKnown(kind, key, !isOn());
    paint();
    if (opts.onChange) opts.onChange();
  });
  paint();
  return btn;
}

// ---------- Detail znaku ----------
function CharView(hex) {
  const c = String.fromCodePoint(parseInt(hex, 16));
  const z = CHARS[c];
  if (!z) return NotFoundView();
  const idx = CHAR_ORDER.indexOf(c);
  const prev = CHAR_ORDER[idx - 1];
  const next = CHAR_ORDER[idx + 1];
  const words = COURSE.vocab.filter((v) => v.zh.includes(c));
  const usedIn = (USED_IN[c] || []).filter((x) => x !== c);
  const t = CHAR_TYPES[z.typ] || { label: z.typ, desc: '' };

  const hero = h('header', { class: 'char-hero' },
    h('button', { class: 'tzg', type: 'button', 'aria-label': `Přehrát ${c}`, onclick: () => Speech.speak(c) }, c),
    h('div', { class: 'stack', style: 'gap:10px;min-width:0' },
      h('span', { class: 'eyebrow' }, z.dil ? 'Základní díl znaků' : z.first ? `Znak z lekce ${z.first}` : 'Znak'),
      h('h1', null, pyEl(z.py, 'char-py'), h('span', { class: 'hero-cz' }, z.cz)),
      h('div', { class: 'row' }, typeChip(z.typ), h('span', { class: 'muted', style: 'font-size:var(--fs-s)' }, t.desc)),
      h('div', { class: 'row' },
        sayBtn(c),
        STROKES[c] ? h('button', { class: 'btn btn-small', type: 'button', onclick: () => Writer.open([c], 0) }, 'Tahy a psaní') : null,
        z.dil ? null : knownBtn('c', c, { label: c }))));

  // Rovnice: díly → znak
  const formula = z.dily.length
    ? h('div', { class: 'formula', 'aria-label': `${z.dily.map((d) => d.c).join(' + ')} = ${c}` },
      z.dily.map((d, i) => [i ? h('span', { class: 'op' }, '+') : null, charCell(d.c, 56)]),
      h('span', { class: 'op' }, '='),
      h('span', { class: 'tzg', style: '--s:56px' }, c))
    : null;
  const parts = h('section', { class: 'sheet stack' },
    h('h2', null, 'Z čeho se skládá'),
    formula,
    z.dily.length
      ? h('div', { class: 'parts' }, z.dily.map((d) => h('div', { class: 'part' },
        charCell(d.c, 44),
        h('span', { class: `role-chip role-${d.role}` }, ROLE_LABELS[d.role] || d.role),
        makeSayable(h('span', { class: 'part-cz' }, d.cz)))))
      : h('p', { class: 'muted' }, 'Tenhle znak se dál nedělí na díly s vlastním významem. Je to základní kostka, ze které se skládají jiné znaky.'));

  const story = h('section', { class: 'sheet stack' },
    h('h2', null, 'Jak znak vznikl'),
    makeSayable(h('p', { class: 'story' }, z.pribeh)),
    z.trad ? h('div', { class: 'trad' },
      h('span', { class: 'tzg', style: '--s:56px' }, z.trad),
      h('p', { class: 'muted' }, 'Tradiční podoba. Takhle se znak píše na Tchaj-wanu, v Hongkongu a ve starších textech. V pevninské Číně se používá zjednodušený tvar.')) : null);

  const used = usedIn.length ? h('section', { class: 'stack' },
    h('h2', { class: 'section-title' }, z.dil ? 'Najdeš ho v těchto znacích' : 'Je dílem i v těchto znacích'),
    h('div', { class: 'char-grid-tiles' }, usedIn.map(charTile))) : null;

  const wordList = words.length ? h('section', { class: 'stack' },
    h('h2', { class: 'section-title' }, 'Slova z kurzu'),
    h('div', { class: 'sheet', style: 'padding-block:4px' }, words.map((v) => vocabRow(v, { tag: true })))) : null;

  const nav = h('nav', { class: 'step-foot', 'aria-label': 'Další znaky' },
    prev ? h('a', { class: 'btn', href: charHash(prev) }, h('span', { html: ICONS.arrowL, style: 'display:contents' }), h('span', { class: 'zh' }, prev)) : h('span'),
    h('a', { class: 'btn', href: '#slovnik-znaky' }, 'Všechny znaky'),
    next ? h('a', { class: 'btn', href: charHash(next) }, h('span', { class: 'zh' }, next), h('span', { html: ICONS.arrowR, style: 'display:contents' })) : h('span'));

  return appendAll(h('div', { class: 'narrow stack-l' }), hero, parts, story, used, wordList, nav);
}

// ---------- Detail slova (okno) ----------
const WordSheet = {
  open(word) {
    const v = COURSE.vocab.find((x) => x.zh === word.zh) || null;
    const dlg = $('#word');
    const chars = [...new Set(onlyHan(word.zh))];
    const close = h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Zavřít', html: ICONS.close, onclick: () => dlg.close() });
    const meaning = v && v.cz !== word.cz ? h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, `Ve slovníku: ${v.cz}`) : null;
    dlg.replaceChildren(
      h('div', { class: 'dlg-head' },
        h('div', { style: 'min-width:0' },
          h('h2', { id: 'word-title', class: 'zh', style: 'font-size:2rem;font-family:var(--font-han)' }, word.zh),
          h('div', { class: 'row' }, pyEl(word.py), h('span', null, `· ${word.cz}`))),
        close),
      h('div', { class: 'dlg-body' },
        meaning,
        h('div', { class: 'row' },
          sayBtn(word.zh),
          v ? knownBtn('w', cardKey(v), { word: v, label: v.zh }) : null,
          v ? h('a', { class: 'btn btn-small', href: `#l${v.l}-slovicka`, onclick: () => dlg.close() }, `Lekce ${v.l}`) : null),
        chars.length ? h('div', { class: 'stack', style: 'gap:8px' },
          h('span', { class: 'eyebrow' }, chars.length > 1 ? 'Znaky ve slově' : 'Znak'),
          chars.map((c) => {
            const z = CHARS[c];
            if (!z) return h('div', { class: 'part' }, h('span', { class: 'tzg', style: '--s:44px' }, c), h('span', { class: 'muted' }, 'Pro tenhle znak zatím nemám rozbor.'));
            return h('a', { class: 'part part-link', href: charHash(c), onclick: () => dlg.close() },
              h('span', { class: 'tzg', style: '--s:44px' }, c),
              h('span', { style: 'min-width:0' },
                h('span', { class: 'row', style: 'gap:6px' }, pyEl(z.py), h('b', null, z.cz)),
                h('span', { class: 'muted', style: 'display:block;font-size:var(--fs-s)' },
                  z.dily.length ? z.dily.map((d) => `${d.c} ${d.cz}`).join(' + ') : CHAR_TYPES[z.typ].label)),
              h('span', { class: 'chev', 'aria-hidden': 'true' }, '›'));
          })) : null));
    if (!dlg.open) dlg.showModal();
    if (hasHan(word.zh)) Speech.speak(word.zh);
  },
};

// src/js/dictionary.js
// Slovník: všechna slova, všechny znaky a Můj slovník (co umím).

const DICT_TABS = [
  { key: 'slova', hash: '#slovnik', label: 'Slova' },
  { key: 'znaky', hash: '#slovnik-znaky', label: 'Znaky' },
  { key: 'moje', hash: '#slovnik-moje', label: 'Můj slovník' },
];

function DictionaryView(tab = 'slova') {
  const current = DICT_TABS.find((t) => t.key === tab) || DICT_TABS[0];
  const tabs = h('nav', { class: 'tabs', 'aria-label': 'Části slovníku' }, DICT_TABS.map((t) =>
    h('a', { href: t.hash, 'aria-current': t === current ? 'page' : null }, t.label)));
  const body = current.key === 'znaky' ? CharsTab() : current.key === 'moje' ? MineTab() : WordsTab();
  return h('div', { class: 'narrow stack' },
    h('header', { class: 'page-head', style: 'margin-bottom:8px' },
      h('span', { class: 'eyebrow' }, '词典 cídiǎn'),
      h('h1', null, 'Slovník'),
      h('p', { class: 'lead' }, 'Slova a znaky z osmi lekcí. U každého znaku najdeš, z čeho se skládá a jak vznikl.')),
    tabs, body);
}

// ---------- Slova ----------
function WordsTab() {
  const cfg = { q: '', lesson: 0 };
  const list = h('div', { class: 'sheet', style: 'padding-block:4px' });
  const count = h('p', { class: 'muted', 'aria-live': 'polite', style: 'font-size:var(--fs-s)' });
  const input = h('input', {
    class: 'search', id: 'dict-search', type: 'search', autocomplete: 'off',
    placeholder: 'Hledej: dobrý, hao, hǎo, 好…', 'aria-label': 'Hledat ve slovníku',
  });

  const matches = (v) => {
    if (cfg.lesson && v.l !== cfg.lesson) return false;
    const q = cfg.q.trim();
    if (!q) return true;
    if (hasHan(q)) return v.zh.includes(onlyHan(q));
    if (czKey(v.cz).includes(czKey(q))) return true;
    const pk = pyKey(q.replace(/[1-5]/g, ''));
    return !!pk && pyKey(v.py).includes(pk);
  };

  const draw = () => {
    const found = COURSE.vocab.filter(matches);
    count.textContent = `Zobrazeno ${found.length} z ${plural(COURSE.vocab.length, 'slova', 'slov', 'slov')}. Klepni na slovo a uvidíš jeho znaky.`;
    if (!found.length) {
      list.replaceChildren(h('p', { class: 'muted', style: 'padding:16px 4px' }, 'Nic takového v kurzu není. Zkus jiné slovo nebo pinyin bez tónů.'));
      return;
    }
    list.replaceChildren(...found.map((v) => vocabRow(v, { tag: true, open: true })));
  };

  input.addEventListener('input', () => { cfg.q = input.value; draw(); });
  const chips = h('div', { class: 'row', role: 'group', 'aria-label': 'Filtrovat podle lekce' },
    [0, ...LESSONS.map((l) => l.n)].map((n) => h('button', {
      class: 'chip', type: 'button', 'aria-pressed': String(cfg.lesson === n),
      onclick: (e) => {
        cfg.lesson = n;
        $$('.chip', chips).forEach((c) => c.setAttribute('aria-pressed', String(c === e.currentTarget)));
        draw();
      },
    }, n ? `L${n}` : 'Všechny lekce')));

  draw();
  return h('div', { class: 'stack' }, input, chips, count, list);
}

// ---------- Znaky ----------
function CharsTab() {
  const groups = LESSONS.map((l) => ({
    title: `Lekce ${l.n}: ${l.title}`,
    chars: CHAR_ORDER.filter((c) => !CHARS[c].dil && CHARS[c].first === l.n),
  })).filter((g) => g.chars.length);
  const parts = CHAR_ORDER.filter((c) => CHARS[c].dil);
  const counts = {};
  for (const c of CHAR_ORDER) if (!CHARS[c].dil) counts[CHARS[c].typ] = (counts[CHARS[c].typ] || 0) + 1;

  const types = h('section', { class: 'sheet stack' },
    h('h2', null, 'Jak znaky vznikají'),
    h('p', { class: 'muted' }, 'Každý znak patří k jednomu ze šesti typů. Když víš, jak znak vznikl, nepamatuješ si čáranice, ale příběh.'),
    h('div', { class: 'type-list' }, Object.entries(CHAR_TYPES).map(([k, t]) => h('div', { class: 'type-row' },
      typeChip(k),
      h('span', null, t.desc),
      h('span', { class: 'muted num' }, String(counts[k] || 0))))));

  return h('div', { class: 'stack-l' },
    types,
    groups.map((g) => h('section', { class: 'stack' },
      h('h2', { class: 'section-title' }, g.title),
      h('div', { class: 'char-grid-tiles' }, g.chars.map(charTile)))),
    h('section', { class: 'stack' },
      h('h2', { class: 'section-title' }, 'Základní díly (radikály)'),
      h('p', { class: 'muted' }, 'Kostky, ze kterých se skládají ostatní znaky. Když je poznáš, uhodneš u nového znaku, o čem asi je.'),
      h('div', { class: 'char-grid-tiles' }, parts.map(charTile))));
}

// ---------- Můj slovník ----------
function MineTab() {
  const wrap = h('div', { class: 'stack-l' });
  const draw = () => {
    const chars = CHAR_ORDER.filter((c) => !CHARS[c].dil && isKnownChar(c));
    const words = COURSE.vocab.filter(isKnownWord);
    const fromCards = words.filter((v) => !knownMark('w', cardKey(v))).length;
    const totalChars = CHAR_ORDER.filter((c) => !CHARS[c].dil).length;
    wrap.replaceChildren(
      h('div', { class: 'statline' },
        h('span', null, 'Znaky, které umíš ', h('b', null, `${chars.length} / ${totalChars}`)),
        h('span', null, 'Slova, která umíš ', h('b', null, `${words.length} / ${COURSE.vocab.length}`))),
      h('section', { class: 'stack' },
        h('h2', { class: 'section-title' }, 'Moje znaky'),
        chars.length
          ? h('div', { class: 'char-grid-tiles' }, chars.map(charTile))
          : h('p', { class: 'muted' }, 'Zatím žádné. Otevři znak (ve Slovníku na záložce Znaky nebo v lekci) a klepni na „Umím“.')),
      h('section', { class: 'stack' },
        h('h2', { class: 'section-title' }, 'Moje slova'),
        fromCards ? h('p', { class: 'muted', style: 'font-size:var(--fs-s)' }, `${plural(fromCards, 'slovo je', 'slova jsou', 'slov je')} tu z kartiček, kde patří mezi naučená. Tlačítkem ✓ je můžeš odebrat.`) : null,
        words.length
          ? h('div', { class: 'sheet', style: 'padding-block:4px' }, words.map((v) => vocabRow(v, { tag: true, open: true, onKnownChange: draw })))
          : h('p', { class: 'muted' }, 'Zatím žádná. U slova klepni na „+“, nebo ho v kartičkách několikrát označ „Umím“ a přidá se samo.')));
  };
  draw();
  return wrap;
}

// src/js/reference.js
// Příručka: přehled gramatiky, radikály, klíč ke cvičením a co dál.

function ReferenceView() {
  const ap = COURSE.appendix;
  const lessonLinks = (ns) => ns.map((n, i) => [i ? ', ' : '', h('a', { href: `#l${n}-gramatika` }, n)]);

  const grammar = h('section', { class: 'stack', id: 'gramatika' },
    h('h2', { class: 'section-title' }, ap.titles.A),
    renderBlocks(ap.grammar.intro),
    h('div', { class: 'table-wrap' }, makeSayable(h('table', null,
      h('thead', null, h('tr', null, h('th', null, 'Vzorec'), h('th', null, 'Příklad'), h('th', null, 'Lekce'))),
      h('tbody', null, ap.grammar.rows.map((r) => h('tr', null,
        h('td', { html: r.pattern }),
        h('td', { class: 'zh' }, r.example),
        h('td', null, lessonLinks(r.lessons)))))))));

  const radicals = h('section', { class: 'stack', id: 'radikaly' },
    h('h2', { class: 'section-title' }, ap.titles.B),
    renderBlocks(ap.radicals.intro),
    h('div', { class: 'rad-grid' }, ap.radicals.rows.map((r) => {
      const first = r.rad.split('/')[0].trim();
      return h('article', { class: 'rad-card' },
        STROKES[first]
          ? h('button', { class: 'tzg', type: 'button', 'aria-label': `Tahy radikálu ${first}`, onclick: () => Writer.open([first, ...r.chars], 0) }, r.rad.replace(/\s/g, ''))
          : h('span', { class: 'tzg' }, r.rad.replace(/\s/g, '')),
        h('div', { style: 'min-width:0' },
          h('b', null, r.meaning),
          makeSayable(h('div', { class: 'chars' }, r.chars.join(' '))),
          h('div', { class: 'lessons' }, 'Lekce ', r.lessons.map((n, i) => [i ? ', ' : '', h('a', { href: `#l${n}-znaky` }, n)]))));
    })));

  const key = h('section', { class: 'stack', id: 'klic' },
    h('h2', { class: 'section-title' }, ap.titles.C),
    h('p', { class: 'muted' }, 'Ve cvičeních v aplikaci se odpovědi kontrolují samy. Klíč se hodí, když cvičíš na papíře.'),
    LESSONS.map((l) => h('details', { class: 'key' },
      h('summary', null, `Lekce ${l.n}: ${l.title}`),
      makeSayable(h('div', { html: ap.key[l.n] || '' })))));

  const next = h('section', { class: 'stack', id: 'co-dal' },
    h('h2', { class: 'section-title' }, ap.titles.D),
    renderBlocks(ap.next));

  return h('div', { class: 'narrow stack-l' },
    h('header', { class: 'page-head' },
      h('span', { class: 'eyebrow' }, 'Přílohy'),
      h('h1', null, 'Příručka'),
      h('p', { class: 'lead' }, 'Všechno důležité z kurzu na jednom místě. Když si nevíš rady, začni tady.')),
    h('nav', { class: 'subnav', 'aria-label': 'Oddíly příručky' },
      [['gramatika', 'Gramatika'], ['radikaly', 'Radikály'], ['klic', 'Klíč ke cvičením'], ['co-dal', 'Co dál']].map(([id, label]) =>
        h('button', { class: 'chip', type: 'button', onclick: () => document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' }) }, label))),
    grammar, radicals, key, next);
}

// src/js/main.js
// Směrování podle # v adrese a spuštění aplikace.

const VIEWS = {
  domu: HomeView,
  uvod: IntroView,
  slovnik: DictionaryView,
  karticky: () => CardsView(null),
  tony: TonesView,
  prirucka: ReferenceView,
};

let lastRoute = '';
function route() {
  const hash = decodeURIComponent(location.hash.slice(1)) || 'domu';
  const main = $('#view');
  runLeave();
  Speech.stop();
  $$('dialog[open]').forEach((d) => d.close());

  let view;
  let nav = hash;
  let m;
  if ((m = /^l(\d+)(?:-([a-z]+))?$/.exec(hash))) {
    view = LessonView(Number(m[1]), m[2]);
    nav = 'domu';
  } else if ((m = /^slovnik(?:-(znaky|moje))?$/.exec(hash))) {
    view = DictionaryView(m[1] || 'slova');
    nav = 'slovnik';
  } else if ((m = /^znak-([0-9a-f]+)$/.exec(hash))) {
    view = CharView(m[1]);
    nav = 'slovnik';
  } else if ((m = /^karticky-l(\d+)$/.exec(hash))) {
    view = CardsView(Number(m[1]));
    nav = 'karticky';
  } else if (VIEWS[hash]) {
    view = VIEWS[hash]();
  } else {
    view = NotFoundView();
  }
  if (hash === 'uvod') nav = 'domu';

  main.replaceChildren(view);
  $$('.mainnav a').forEach((a) => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  const sameLesson = /^l\d+/.test(hash) && hash.split('-')[0] === lastRoute.split('-')[0];
  if (sameLesson) {
    const steps = $('.steps', main);
    if (steps && steps.getBoundingClientRect().top < 0) steps.scrollIntoView({ block: 'start' });
  } else {
    window.scrollTo(0, 0);
  }
  if (lastRoute) main.focus({ preventScroll: true });
  lastRoute = hash;
}

function boot() {
  applySettings();
  Speech.init();
  $('#settings-open').addEventListener('click', () => SettingsPanel.open());
  $('#writer').addEventListener('close', () => { if (Writer.writer && Writer.writer.cancelQuiz) Writer.writer.cancelQuiz(); });
  for (const id of ['settings', 'writer', 'word']) {
    const dlg = document.getElementById(id);
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
  }
  window.addEventListener('hashchange', route);
  route();
  Sync.init(() => {
    // Pokrok z jiného zařízení: přehled se překreslí hned, ostatní obrazovky při dalším přechodu.
    if (['', 'domu'].includes(location.hash.slice(1))) route();
  });
}

boot();

})();
